<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet EPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Carnet EPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">

<style>
/* Appli volontairement en fond blanc, quel que soit le thème du téléphone. */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  color-scheme: light;
  --ink:#141821; --ink-2:#3D4557; --ink-3:#6E7688;
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F6;
  --line:#E4E5EA; --line-strong:#C8CAD3;
  --accent:#4459E8; --accent-soft:#EAECFD; --accent-ink:#2C3AA8;
  --warn:#B4740F; --warn-soft:#FCF2DF;
  --alert:#C0392F; --alert-soft:#FDE9E6;
  --ok:#2E7D5B; --ok-soft:#E4F2EC;
  --shadow:0 1px 2px rgba(20,24,33,.05), 0 6px 18px rgba(20,24,33,.05);
  --r:14px;
  /* couleur du niveau en cours, réécrite élément par élément */
  --c:#4459E8; --cs:#EAECFD;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
#app{max-width:640px;margin:0 auto;padding:0 16px 112px}
h1,h2,h3,.disp{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:18px 0 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
header.top h1{font-size:22px;font-weight:800;min-width:0}
header.top .sub{display:block;font-family:"Public Sans",sans-serif;font-size:11px;font-weight:600;
  color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
header.top.tinted{border-bottom:2px solid var(--c)}
header.top.tinted .sub{color:var(--c)}
header.top.tinted h1{color:var(--c)}
.backbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  width:44px;height:44px;border-radius:12px;font-size:20px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.sect{margin-top:24px}
.sect > .eyebrow{margin-bottom:10px;display:block}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5;
  border:1px dashed var(--line-strong);border-radius:var(--r)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;
  align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.danger{color:var(--alert);border-color:var(--alert);background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
label.field{display:block}
label.field > span{display:block;font-size:11px;font-weight:600;color:var(--ink-3);
  margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-accent{background:var(--accent-soft);color:var(--accent-ink)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-alert{background:var(--alert-soft);color:var(--alert)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-quiet{background:var(--surface-2);color:var(--ink-3)}

.course{display:flex;align-items:stretch;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;padding:0}
.course .slot{flex:none;width:64px;background:var(--cs);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 0}
.course .slot b{font-family:Archivo;font-size:15px;font-weight:700;color:var(--c)}
.course .slot span{font-size:10px;color:var(--c);letter-spacing:.04em;font-weight:600}
.course .body{padding:14px;flex:1;min-width:0}
.course .cname{font-family:Archivo;font-weight:700;font-size:19px;display:block;color:var(--c)}
.course .capsa{font-size:13px;color:var(--ink-2);margin-top:2px;display:block}
.chev{color:var(--ink-3);font-size:20px;flex:none}
.course .chev{align-self:center;padding-right:14px}

.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.prow .nm{font-weight:600}
.prow .meta{font-size:12px;color:var(--ink-3)}
.avatar{flex:none;width:38px;height:38px;border-radius:11px;background:var(--cs);
  display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:13px;color:var(--c)}
.avatar.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.avatar.alert{background:var(--alert-soft);color:var(--alert);box-shadow:inset 0 0 0 1.5px var(--alert)}
.prow.tinted{border-left:4px solid var(--c)}
.b-classe{background:var(--cs);color:var(--c)}

/* Fiche de séance du jour */
.fiche{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.fiche-num{flex:none;background:var(--cs);color:var(--c);border-radius:12px;padding:8px 12px;
  font-size:11px;font-weight:600;text-align:center;line-height:1.15;text-transform:uppercase;letter-spacing:.06em}
.fiche-num b{display:block;font-family:"IBM Plex Mono",monospace;font-size:24px;letter-spacing:0}
.fiche-num span{font-size:11px;opacity:.8}
.fiche-titre{font-family:Archivo;font-size:17px;line-height:1.25;display:block}
.fiche p{margin:14px 0 0;font-size:14px;line-height:1.5}
.fiche .eyebrow{display:block;margin-bottom:3px}
.fiche-mat{color:var(--ink-2)}
.fiche-der{margin-top:14px}
/* Feuilletage du cycle depuis le cours du jour : deux flèches de 44 px, et un
   liseré atténué quand on regarde une séance qui n'est pas celle d'aujourd'hui. */
.fl{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--c);font-size:24px;line-height:1;cursor:pointer}
.fl[disabled]{opacity:.3;cursor:default}
.fiche.passee{border-left-color:var(--line)}
.fiche-ici{margin-top:10px !important}
.der-l{display:block;font-size:14px;line-height:1.45;padding:7px 0 7px 16px;position:relative;
  border-top:1px solid var(--line)}
.der-l:first-of-type{border-top:0}
.der-l::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;
  border-radius:50%;background:var(--c)}

/* Fiche de séance exploitable en cours : matériel repliable, étapes,
   minuteurs. Cibles tactiles à 44 px minimum, lisibles à un mètre. */
.mat-bandeau{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
  padding:0 12px;margin-top:14px;border:1px solid var(--line-strong);border-radius:12px;
  background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.mat-bandeau .fl{flex:none;color:var(--c);font-size:13px;transition:transform .15s}
.mat-bandeau[aria-expanded="true"] .fl{transform:rotate(90deg)}
.mat-liste{margin:8px 0 0;padding:0;list-style:none}
.mat-liste li{padding:7px 0 7px 18px;position:relative;font-size:14px;line-height:1.4;
  border-top:1px solid var(--line)}
.mat-liste li:first-child{border-top:0}
.mat-liste li::before{content:"";position:absolute;left:3px;top:15px;width:6px;height:6px;
  border-radius:2px;background:var(--c)}

.etape{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;
  background:var(--surface)}
.etape.faite{opacity:.55}
.etape.faite .etape-titre{text-decoration:line-through}
.etape-tete{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cs);flex-wrap:wrap}
.coche-etape{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--c);
  background:var(--surface);color:#fff;font-size:20px;font-weight:700;line-height:1;
  display:grid;place-items:center}
.coche-etape[aria-pressed="true"]{background:var(--c)}
.etape-num{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--c);
  color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:15px}
/* Le titre prend toute la largeur sous la première ligne : lisible à un mètre,
   sans être compressé entre le numéro et la durée sur un écran étroit. */
.etape-titre{flex:1 0 100%;order:3;font-family:Archivo;font-weight:800;font-size:21px;
  line-height:1.15;color:var(--c);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.etape-duree{flex:none;margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:14px;color:var(--c);background:var(--surface);border-radius:999px;padding:6px 12px}
.etape-corps{padding:12px}
.etape-consigne{margin:0 0 10px;font-size:15.5px;line-height:1.45}
.etape-consigne:last-of-type{margin-bottom:0}
.qual{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--surface-2);
  font-size:14px;line-height:1.45}
.qual .qual-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:3px;color:var(--ink-3)}
.qual.q-reussite{background:var(--ok-soft)} .qual.q-reussite .qual-lbl{color:var(--ok)}
.qual.q-realisation{background:var(--accent-soft)} .qual.q-realisation .qual-lbl{color:var(--accent-ink)}
.repli{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:8px;
  padding:0 12px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);
  font-size:14px;font-weight:600;color:var(--ink-2);text-align:left}
.repli .fl{flex:none;color:var(--ink-3);transition:transform .15s}
.repli[aria-expanded="true"] .fl{transform:rotate(90deg)}
.repli-corps{margin-top:6px;padding:9px 11px;border-radius:10px;background:var(--surface-2);
  font-size:14px;line-height:1.45}
.repli-corps p{margin:0 0 7px}
.repli-corps p:last-child{margin-bottom:0}

.chrono{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.chrono-t{flex:none;min-width:96px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:26px;line-height:1;padding:8px 10px;border-radius:12px;
  background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.chrono-t.marche{background:var(--c);color:#fff}
.chrono-t.fini{background:var(--alert);color:#fff}
.chrono button{flex:1;min-width:84px;min-height:44px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .chrono-t.fini{animation:sonne .8s steps(1) infinite}
  @keyframes sonne{50%{background:var(--surface-2);color:var(--alert)}}
}

.chrono-plein{flex:none;width:44px;min-width:44px;min-height:44px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--c);
  font-size:19px;line-height:1;display:grid;place-items:center}

/* Minuteur en grand : simple couche fixe par-dessus l'appli, pas de
   requestFullscreen, qui casse au retour sur tablette. */
.plein{position:fixed;inset:0;z-index:80;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.plein-titre{font-family:Archivo;font-weight:800;font-size:clamp(18px,5.5vw,30px);
  line-height:1.15;color:var(--c);text-transform:uppercase;text-align:center;
  max-width:92%;text-wrap:balance}
.plein-t{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;
  font-size:min(30vw,52vh);color:var(--ink)}
.plein-t.marche{color:var(--c)}
.plein-t.fini{color:var(--alert)}
@media (prefers-reduced-motion:no-preference){
  .plein-t.fini{animation:sonne .8s steps(1) infinite}
}
.plein-btns{display:flex;gap:10px;width:100%;max-width:520px}
.plein-btns button{flex:1;min-height:64px;border-radius:14px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-size:18px;font-weight:700}
.plein-btns button.primaire{background:var(--c);border-color:var(--c);color:#fff}
.plein-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
  width:52px;height:52px;border-radius:14px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-size:22px;line-height:1}

.tirage-nom{margin:6px 0;padding:26px 12px;border-radius:var(--r);background:var(--cs);
  color:var(--c);text-align:center;font-family:Archivo;font-weight:800;line-height:1.05;
  font-size:clamp(30px,11vw,58px);word-break:break-word;min-height:118px;
  display:flex;align-items:center;justify-content:center}
.tirage-nom .pre{display:block}
.tirage-nom small{display:block;font-family:"Public Sans",sans-serif;font-weight:600;
  font-size:15px;letter-spacing:.04em;margin-top:8px;opacity:.75;text-transform:uppercase}
.tirage-cpt{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* Groupes de niveau */
.grp{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px}
.grp b{font-size:15px}
.grp .meta{font-size:12px;color:var(--ink-3)}
.gpast{flex:none;width:34px;height:34px;border-radius:10px;background:var(--cs);color:var(--c);
  display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:15px}
.erow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;
  background:var(--cs);border:1px solid var(--c);border-radius:12px}
.erow b{font-size:14px;font-weight:600;color:var(--ink)}
.erow .meta{font-size:12px;color:var(--c);font-weight:600}
.erow.hors{background:var(--surface);border-color:var(--line)}
.erow.hors .gpast{background:var(--surface-2);color:var(--ink-3)}
.erow.hors .meta{color:var(--ink-3);font-weight:400}
.gtag{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:var(--cs);color:var(--c);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[style]{border-color:var(--c);color:var(--c)}
.chip[style][aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}

/* Liste des séances du cycle */
.seance-l{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seance-l .sn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);
  color:var(--ink-3);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.seance-l b{font-size:14px;font-weight:600}
.seance-l .meta{font-size:12px;color:var(--ink-3)}
.seance-l.faite{opacity:.62}
.seance-l.faite .sn{background:var(--ok-soft);color:var(--ok)}
.seance-l.auj{border-color:var(--c);border-left:4px solid var(--c);background:var(--cs)}
.seance-l.auj .sn{background:var(--c);color:#fff}

.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow.abs{opacity:.55}
.srow .top{display:flex;align-items:center;gap:10px}
.linkish{border:0;background:none;text-align:left;padding:0;min-width:0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.act{flex:1;min-width:66px;min-height:42px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.act.oubli[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.act.absent[aria-pressed="true"]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.act.disp[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.act.rem[data-has="1"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.dot.on{background:var(--warn)}
.dot.on.max{background:var(--alert)}

.hero{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  border-top:5px solid var(--c);box-shadow:var(--shadow)}
.hero .nm{font-family:Archivo;font-size:24px;font-weight:800;line-height:1.15;color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;line-height:1.2}
.stat span{font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.stat.is-note{background:var(--accent-soft)} .stat.is-note b{color:var(--accent-ink)}
.stat.is-rem{background:var(--ok-soft)} .stat.is-rem b{color:var(--ok)}
.stat.is-alert{background:var(--alert-soft)} .stat.is-alert b{color:var(--alert)}
.stat.is-warn{background:var(--warn-soft)} .stat.is-warn b{color:var(--warn)}

.sanction{border:1px solid var(--alert);background:var(--alert-soft);color:var(--alert);
  border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start}
.sanction b{font-family:Archivo;display:block;font-size:15px}
.sanction p{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--ink-2)}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:20px}
.tabs button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;
  font-size:14px;font-weight:600;color:var(--ink-3)}
.tabs button[aria-selected="true"]{background:var(--c);color:#fff;box-shadow:var(--shadow)}

.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.item .when{font-size:12px;color:var(--ink-3)}
.item p{margin:6px 0 0;font-size:14px;line-height:1.45}

.note-line{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);

<body>
<div id="app"></div>
<nav class="tabbar" id="nav"></nav>

<script>
"use strict";

/* ══════════ Modèle ══════════ */
/* Numéro de version affiché dans les Réglages. À garder identique à VERSION
   dans sw.js : c'est le seul moyen de savoir ce que la tablette exécute
   vraiment quand une mise à jour semble ne pas être arrivée. */
var BUILD = "v9";

var KEY = "carnet-eps-v1";
function uid(){ return Math.random().toString(36).slice(2,10); }

var NIVEAUX = [
  {n:1, court:"MI",  long:"Maîtrise insuffisante"},
  {n:2, court:"MF",  long:"Maîtrise fragile"},
  {n:3, court:"MS",  long:"Maîtrise satisfaisante"},
  {n:4, court:"TBM", long:"Très bonne maîtrise"}
];

/* Emploi du temps relevé sur Pronote.
   variante "A" = semaines impaires (S37, S39…), "B" = semaines paires (S38, S40…) */
var EDT = [
  {jour:1, slot:"M1-M2", classe:"6E1"},
  {jour:1, slot:"M3-M4", classe:"5E1"},
  {jour:1, slot:"S1-S2", classe:"5E2"},
  {jour:2, slot:"M1-M2", classe:"4E4"},
  {jour:2, slot:"M3-M4", classe:"3E2"},
  {jour:4, slot:"M1-M2", classe:"5E1",    variante:"A"},
  {jour:4, slot:"M1-M2", classe:"5E2",    variante:"B"},
  {jour:4, slot:"M3-M4", classe:"4E4P.2", variante:"A"},
  {jour:4, slot:"M3-M4", classe:"4E4P.1", variante:"B"},
  {jour:5, slot:"M1-M2", classe:"3E2P.2", variante:"A"},
  {jour:5, slot:"M1-M2", classe:"3E2P.1", variante:"B"},
  {jour:5, slot:"M3-M4", classe:"6E1"}
];
/* Une couleur par niveau : la classe se reconnaît sans lire son nom. */
var COULEURS = {
  "6": ["#0B7A72", "#DEF1EF"],   /* 6e — vert lagon */
  "5": ["#6B45D9", "#EBE4FC"],   /* 5e — violet */
  "4": ["#C2600B", "#FCEEDD"],   /* 4e — orange brûlé */
  "3": ["#C42C63", "#FCE3EC"]    /* 3e — framboise */
};
function couleurClasse(nom){ return COULEURS[String(nom).charAt(0)] || ["#4459E8", "#EAECFD"]; }
function styleClasse(nom){
  var c = couleurClasse(nom);
  return ' style="--c:' + c[0] + ';--cs:' + c[1] + '"';
}

var SLOTS = {"M1-M2":"08h–10h", "M3-M4":"10h–12h", "S1-S2":"14h–16h", "S3-S4":"16h–18h"};
var ORDRE_SLOT = ["M1-M2","M3-M4","S1-S2","S3-S4"];
var JOURS = ["lundi","mardi","mercredi","jeudi","vendredi"];

/* Aucune liste d'élève n'est écrite dans le code : ce fichier est publié sur
   un dépôt public, et les noms d'élèves sont des données personnelles de
   mineurs. Les listes arrivent par Réglages → Importer une sauvegarde, et ne
   quittent jamais le téléphone. Format attendu si on en remet un jour :
   "NOM|Prénom", le séparateur évitant toute erreur sur les noms composés. */
var ELEVES_REELS = {
  "6E1": [], "5E1": [], "5E2": [], "4E4": [], "3E2": []
};

/* Groupes de besoin : ce sont les élèves de la classe entière, pas des fiches
   séparées. Un oubli saisi en 4E4P.1 compte donc aussi en 4E4. */
var GROUPES = {
  "4E4P.1": {parent:"4E4", membres:[]},
  "4E4P.2": {parent:"4E4", membres:[]},
  "3E2P.1": {parent:"3E2", membres:[]},
  "3E2P.2": {parent:"3E2", membres:[]}
};

/* Associe les libellés "NOM|Prénom" d'un groupe aux fiches de la classe parente. */
function membresDepuisLibelles(classes, eleves, nomGroupe){
  var g = GROUPES[nomGroupe];
  if(!g) return null;
  var parent = classes.filter(function(c){ return c.nom === g.parent; })[0];
  if(!parent) return null;
  var ids = [];
  g.membres.forEach(function(lib){
    var p = lib.split("|");
    var e = eleves.filter(function(x){
      return x.classeId === parent.id && x.nom === p[0] && x.prenom === (p[1] || "");
    })[0];
    if(e) ids.push(e.id);
  });
  return ids;
}

function elevesReelsDe(classeId, nomClasse){
  return (ELEVES_REELS[nomClasse] || []).map(function(s){
    var p = s.split("|");
    return {id:uid(), classeId:classeId, nom:p[0], prenom:p[1] || ""};
  });
}

function defaults(){
  var noms = ["6E1","5E1","5E2","4E4","3E2","3E2P.1","3E2P.2","4E4P.1","4E4P.2"];
  var classes = noms.map(function(n){
    var c = {id:uid(), nom:n, noter:n.charAt(0)!=="6"};
    if(GROUPES[n]) c.groupe = true;
    return c;
  });
  var eleves = [];
  classes.forEach(function(c){ eleves = eleves.concat(elevesReelsDe(c.id, c.nom)); });
  classes.forEach(function(c){
    if(c.groupe) c.membres = membresDepuisLibelles(classes, eleves, c.nom) || [];
  });
  return {
    classes: classes,
    eleves: eleves, apsa: [], events: [], notes: [], comps: [], rappels: [], docs: [],
    dispenses: [], perfs: [], exceptions: [],
    competences: [
      {id:uid(), lbl:"Produire une performance, s'engager"},
      {id:uid(), lbl:"Méthodes et outils pour apprendre"},
      {id:uid(), lbl:"Respect des règles et sécurité"},
      {id:uid(), lbl:"Coopérer, aider, arbitrer"}
    ],
    seuil: 3
  };
}

var S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch(e){ S = defaults(); }
(function(){ var d = defaults(); for (var k in d) if (S[k] === undefined) S[k] = d[k]; })();

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast("Sauvegarde impossible : stockage plein"); return false; }
}

/* ── Installation automatique des listes Pronote ──
   S'exécute une seule fois, à la première ouverture après mise à jour.
   Une fiche déjà présente sous le même nom est réutilisée : ses oublis,
   remarques, notes et compétences sont conservés. Les fiches absentes des
   listes (élèves de démonstration) sont retirées avec leurs données. */
var VERSION_LISTES = 2;
function installerListesReelles(){
  var gardes = {}, nouveaux = [];

  S.classes.forEach(function(cl){
    var libelles = ELEVES_REELS[cl.nom];
    if(!libelles) return;
    libelles.forEach(function(lib){
      var p = lib.split("|"), nom = p[0], prenom = p[1] || "";
      var exist = S.eleves.filter(function(e){
        return e.classeId === cl.id && e.nom === nom && e.prenom === prenom;
      })[0];
      if(exist){ gardes[exist.id] = true; nouveaux.push(exist); }
      else nouveaux.push({id:uid(), classeId:cl.id, nom:nom, prenom:prenom});
    });
  });

  if(!nouveaux.length) return false;

  var retires = S.eleves.filter(function(e){ return !gardes[e.id]; }).map(function(e){ return e.id; });
  S.eleves = nouveaux;
  if(retires.length){
    S.events = S.events.filter(function(x){ return retires.indexOf(x.eleveId) < 0; });
    S.notes  = S.notes.filter(function(x){ return retires.indexOf(x.eleveId) < 0; });
    S.comps  = S.comps.filter(function(x){ return retires.indexOf(x.eleveId) < 0; });
  }

  S.classes.forEach(function(c){
    if(GROUPES[c.nom]){
      c.groupe = true;
      c.membres = membresDepuisLibelles(S.classes, S.eleves, c.nom) || [];
    }
  });
  return true;
}

if(S.versionListes !== VERSION_LISTES){
  installerListesReelles();
  S.versionListes = VERSION_LISTES;
  save();
}

/* ── Documents du collège, transcrits depuis les originaux ── */
var VERSION_DOCS = 3;
var DOCS_COLLEGE = [];

/* Calendrier prévisionnel 2026-2027, transcrit ligne à ligne. */
var CALENDRIER = [];

if(S.versionDocs !== VERSION_DOCS){
  if(!S.docs) S.docs = [];
  if(!S.rappels) S.rappels = [];
  DOCS_COLLEGE.forEach(function(d){
    var deja = S.docs.filter(function(x){ return x.titre === d.titre; })[0];
    if(deja){ deja.cat = d.cat; deja.texte = d.texte; }
    else S.docs.push({id:uid(), titre:d.titre, cat:d.cat, texte:d.texte, maj:AUJ()});
  });
  CALENDRIER.forEach(function(r){
    var deja = S.rappels.filter(function(x){ return x.titre === r[1] && x.date === r[0]; })[0];
    if(deja){
      /* On complète une note restée vide, sans jamais écraser ce que j'ai écrit. */
      if(!deja.note && r[2]) deja.note = r[2];
      return;
    }
    S.rappels.push({id:uid(), titre:r[1], date:r[0], classeId:null, note:r[2], fait:false});
  });
  S.versionDocs = VERSION_DOCS;
  save();
}

/* ── Cours exceptionnels ──
   Remplacements, RCD, échanges de créneau : ils s'ajoutent à la journée sans
   toucher à l'emploi du temps habituel, donc sans fausser le compte des séances
   de cycle. */
var VERSION_EXCEPTIONS = 1;
var EXCEPTIONS_INITIALES = [];
if(S.versionExceptions !== VERSION_EXCEPTIONS){
  if(!S.exceptions) S.exceptions = [];
  EXCEPTIONS_INITIALES.forEach(function(x){
    var deja = S.exceptions.filter(function(y){
      return y.date === x.date && y.slot === x.slot;
    })[0];
    if(deja) return;
    S.exceptions.push({id:uid(), date:x.date, slot:x.slot, libelle:x.libelle, note:x.note});
  });
  S.versionExceptions = VERSION_EXCEPTIONS;
  save();
}

/* Les groupes de niveau étaient d'abord rattachés à la classe : on les
   bascule sur son APSA en cours, pour ne pas perdre une répartition. */
if(!S.groupesParApsa){
  S.classes.forEach(function(c){
    if(!c.niveaux || !c.niveaux.length) return;
    var cible = S.apsa.filter(function(a){ return a.classeId === c.id; })
      .sort(function(a,b){ return (b.debut||"").localeCompare(a.debut||""); })[0];
    if(cible && !(cible.niveaux || []).length){
      cible.niveaux = c.niveaux;
      cible.affect = c.affect || {};
    }
    delete c.niveaux; delete c.affect;
  });
  S.groupesParApsa = true;
  save();
}

/* ══════════ Utilitaires ══════════ */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function iso(d){ var x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function AUJ(){ return iso(new Date()); }
function frDate(s){ if(!s) return "—"; var p = s.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function frLong(s){
  return new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function semaineISO(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(),0,1)) / 86400000 + 1) / 7);
}
function classeById(id){ return S.classes.filter(function(c){return c.id===id})[0]; }
function classeByNom(n){ return S.classes.filter(function(c){return c.nom===n})[0]; }
function eleveById(id){ return S.eleves.filter(function(e){return e.id===id})[0]; }
function elevesDe(cid){
  var c = classeById(cid), l;
  if(c && c.membres){
    /* Groupe de besoin : les fiches appartiennent à la classe entière. */
    l = c.membres.map(eleveById).filter(Boolean);
  } else {
    l = S.eleves.filter(function(e){ return e.classeId === cid; });
  }
  return l.sort(function(a,b){ return (a.nom+a.prenom).localeCompare(b.nom+b.prenom,"fr"); });
}
function estGroupe(c){ return !!(c && c.membres); }

/* ── Groupes de niveau, propres à chaque APSA ──
   Les niveaux en natation n'ont rien à voir avec ceux en badminton :
   ils sont donc rattachés au cycle, pas à la classe. */
var TEINTES = [
  ["#1D4ED8","#E3EAFD"], ["#047857","#DDF2EA"], ["#B45309","#FBEEDA"],
  ["#BE185D","#FBE4EF"], ["#6D28D9","#EDE6FD"], ["#0E7490","#DEF0F5"]
];
function niveauxDe(ap){ return (ap && ap.niveaux) || []; }
function teinte(i){ return TEINTES[i % TEINTES.length]; }
function styleTeinte(i){ var t = teinte(i); return ' style="--c:'+t[0]+';--cs:'+t[1]+'"'; }
function groupeIndexDe(ap, eleveId){
  if(!ap || !ap.affect) return -1;
  var id = ap.affect[eleveId];
  if(!id) return -1;
  var l = niveauxDe(ap);
  for (var i = 0; i < l.length; i++) if(l[i].id === id) return i;
  return -1;
}
function groupeDe(ap, eleveId){
  var i = groupeIndexDe(ap, eleveId);
  return i < 0 ? null : niveauxDe(ap)[i];
}
/* Un appui fait passer au groupe suivant, puis à « sans groupe ». */
function cyclerGroupe(ap, eleveId){
  var l = niveauxDe(ap);
  if(!l.length) return;
  if(!ap.affect) ap.affect = {};
  var i = groupeIndexDe(ap, eleveId);
  if(i + 1 >= l.length) delete ap.affect[eleveId];
  else ap.affect[eleveId] = l[i + 1].id;
  save();
}
function effectifGroupe(ap, classeId, gid){
  return elevesDe(classeId).filter(function(e){ return ap.affect && ap.affect[e.id] === gid; }).length;
}
function sansGroupe(ap, classeId){
  return elevesDe(classeId).filter(function(e){ return groupeIndexDe(ap, e.id) < 0; }).length;
}
/* APSA sur laquelle porter les groupes quand on arrive depuis la classe. */
function apsaCourante(classeId){
  return apsaEnCours(classeId, AUJ())
    || S.apsa.filter(function(a){ return a.classeId === classeId; })
        .sort(function(a,b){ return (b.debut||"").localeCompare(a.debut||""); })[0]
    || null;
}
function classeParente(c){
  if(!estGroupe(c)) return c;
  var g = GROUPES[c.nom];
  return (g && classeByNom(g.parent)) || c;
}
function initiales(e){ return ((e.nom[0]||"") + (e.prenom[0]||"")).toUpperCase(); }
function nbOublis(eid){ return S.events.filter(function(x){return x.eleveId===eid && x.type==="oubli"}).length; }
function oublisDepuisSanction(eid){
  var evs = S.events.filter(function(x){ return x.eleveId===eid && (x.type==="oubli"||x.type==="sanction"); })
    .sort(function(a,b){ return a.date.localeCompare(b.date) || a.id.localeCompare(b.id); });
  var c = 0;
  evs.forEach(function(e){ if(e.type==="sanction") c = 0; else c++; });
  return c;
}
/* Une classe peut mener deux cycles en parallèle, un par créneau : le 6E1 fait
   pratique artistique le lundi et sports collectifs le vendredi. Une APSA sans
   créneau vaut pour tous les créneaux de la classe, comme avant. */
function cleCreneau(date, slot){
  return new Date(date+"T12:00:00").getDay() + "|" + slot;
}
function creneauxDe(classeNom){
  return EDT.filter(function(c){ return c.classe === classeNom; })
    .sort(function(a,b){ return (a.jour - b.jour) || (ORDRE_SLOT.indexOf(a.slot) - ORDRE_SLOT.indexOf(b.slot)); })
    .map(function(c){
      return {cle:c.jour + "|" + c.slot,
              lbl:JOURS[c.jour - 1] + " " + c.slot
                + (c.variante ? " (sem. " + (c.variante === "A" ? "impaire" : "paire") + ")" : "")};
    });
}
function libelleCreneau(cle){
  var p = String(cle).split("|");
  return JOURS[(+p[0]) - 1] + " " + p[1];
}
function apsaEnCours(cid, date, slot){
  var l = S.apsa.filter(function(a){
    return a.classeId===cid && (!a.debut || a.debut<=date) && (!a.fin || a.fin>=date);
  });
  if(slot){
    var cible = cleCreneau(date, slot);
    var precis = l.filter(function(a){ return a.creneau === cible; });
    if(precis.length) return precis[0];
    return l.filter(function(a){ return !a.creneau; })[0] || null;
  }
  return l[0] || null;
}
function exceptionsDuJour(date){
  return (S.exceptions || []).filter(function(x){ return x.date === date; })
    .sort(function(a,b){ return ORDRE_SLOT.indexOf(a.slot) - ORDRE_SLOT.indexOf(b.slot); });
}
function coursDuJour(date){
  var d = new Date(date+"T12:00:00"), j = d.getDay();
  var par = semaineISO(d) % 2 === 1 ? "A" : "B";
  return EDT.filter(function(c){ return c.jour===j && (!c.variante || c.variante===par); })
    .sort(function(a,b){ return ORDRE_SLOT.indexOf(a.slot) - ORDRE_SLOT.indexOf(b.slot); });
}
/* ── Cycle de séances : un créneau de l'emploi du temps = une séance ── */
function datesSeances(classeId, ap){
  if(!ap || !ap.debut) return [];
  var cl = classeById(classeId);
  if(!cl) return [];
  var fin = ap.fin || iso(new Date(new Date(ap.debut+"T12:00:00").getTime() + 120*86400000));
  var l = [], d = new Date(ap.debut+"T12:00:00"), garde = 0;
  while(iso(d) <= fin && garde++ < 400){
    var jour = iso(d);
    coursDuJour(jour).forEach(function(c){
      if(c.classe !== cl.nom) return;
      if(ap.creneau && ap.creneau !== cleCreneau(jour, c.slot)) return;
      l.push({date:jour, slot:c.slot});
    });
    d.setDate(d.getDate() + 1);
  }
  return l;
}
function numeroSeance(classeId, ap, date){
  var l = datesSeances(classeId, ap);
  for (var i = 0; i < l.length; i++) if(l[i].date === date) return i + 1;
  return null;
}
function ficheSeance(ap, num){
  if(!ap || !ap.seances) return null;
  return ap.seances.filter(function(s){ return s.num === num; })[0] || null;
}
function seanceDuJour(classeId, ap, date){
  var num = numeroSeance(classeId, ap, date);
  if(num == null) return null;
  return {num:num, total:datesSeances(classeId, ap).length, fiche:ficheSeance(ap, num)};
}

function moyenne(eid){
  var l = S.notes.filter(function(n){return n.eleveId===eid});
  if(!l.length) return null;
  var s = 0; l.forEach(function(n){ s += n.valeur / n.sur * 20; });
  return (s / l.length).toFixed(1);
}

/* ══════════ Ateliers de performance ══════════
   Trois essais par élève, on garde le meilleur. Selon l'épreuve, « meilleur »
   veut dire la plus grande valeur (lancer, saut) ou la plus petite (course). */
var EPREUVES = [
  {id:"vortex",   nom:"Lancer de vortex",  unite:"m", pas:"0.1",  sens:"max", ph:"18,5"},
  {id:"longueur", nom:"Saut en longueur",  unite:"m", pas:"0.01", sens:"max", ph:"3,45"},
  {id:"sprint50", nom:"50 m",              unite:"s", pas:"0.01", sens:"min", ph:"8,20"}
];
function epreuveById(id){
  return EPREUVES.filter(function(x){ return x.id === id; })[0] || EPREUVES[0];
}
/* Une performance appartient à l'élève, pas à la séance où elle a été mesurée :
   elle reste donc affichée à tous les cours suivants, et se met à jour quand on
   la remesure. La date retenue est celle de la dernière saisie. */
function perfDe(eid, epId){
  return (S.perfs || []).filter(function(p){
    return p.eleveId === eid && p.epreuveId === epId;
  }).sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); })[0] || null;
}
function perfsDe(eid){
  return (S.perfs || []).filter(function(p){ return p.eleveId === eid; })
    .sort(function(a,b){ return b.date.localeCompare(a.date); });
}
function meilleurEssai(essais, sens){
  var l = (essais || []).filter(function(v){ return typeof v === "number" && !isNaN(v); });
  if(!l.length) return null;
  return sens === "min" ? Math.min.apply(null, l) : Math.max.apply(null, l);
}
/* Virgule décimale : c'est ce que les élèves annoncent et ce qu'on tape vite. */
function nombreFr(v){
  if(v == null) return "";
  return String(v).replace(".", ",");
}
function litNombre(txt){
  var t = String(txt).replace(",", ".").trim();
  if(!t) return null;
  var n = parseFloat(t);
  return isNaN(n) || n < 0 ? null : n;
}
function enregistrerEssai(eid, ep, date, apsaId, index, valeur){
  if(!S.perfs) S.perfs = [];
  var p = perfDe(eid, ep.id);
  if(!p){
    p = {id:uid(), eleveId:eid, epreuveId:ep.id, date:date,
         apsaId:apsaId || null, essais:[null,null,null]};
    S.perfs.push(p);
  }
  if(!p.essais) p.essais = [null,null,null];
  p.essais[index] = valeur;
  p.date = date;
  if(apsaId) p.apsaId = apsaId;
  /* Une fiche sans aucun essai ne sert à rien : on la retire. */
  if(!p.essais.filter(function(v){ return v != null; }).length){
    S.perfs = S.perfs.filter(function(x){ return x.id !== p.id; });
  }
  save();
}

/* ══════════ Dispenses de sport ══════════
   Une dispense = un justificatif photographié, avec ses dates.
   Elle n'est jamais supprimée toute seule : passé la date de fin, elle sort
   simplement des classes du jour et bascule dans les dispenses terminées. */
var ORIGINES = {medecin:"Certificat médical", parents:"Mot des parents"};

function dispensesDe(eid){

/* Le stockage du navigateur tient environ 5 Mo : une photo brute suffirait à
   le saturer et à faire échouer l'enregistrement des oublis et des notes.
   On redimensionne donc avant d'enregistrer, jamais après. */
var PHOTO_LARGEUR = 1200, PHOTO_QUALITE = 0.7, QUOTA_OCTETS = 4200000;

function compresserPhoto(fichier, ok, ko){
  var lecteur = new FileReader();
  lecteur.onerror = function(){ ko("Photo illisible"); };
  lecteur.onload = function(){
    var img = new Image();
    img.onerror = function(){ ko("Photo illisible"); };
    img.onload = function(){
      var l = img.width, ht = img.height;
      if(l > PHOTO_LARGEUR){ ht = Math.round(ht * PHOTO_LARGEUR / l); l = PHOTO_LARGEUR; }
      var cv = document.createElement("canvas");
      cv.width = l; cv.height = ht;
      cv.getContext("2d").drawImage(img, 0, 0, l, ht);
      try { ok(cv.toDataURL("image/jpeg", PHOTO_QUALITE)); }
      catch(e){ ko("Photo impossible à convertir"); }
    };
    img.src = lecteur.result;
  };
  lecteur.readAsDataURL(fichier);
}
function poidsDonnees(){

function poidsLisible(n){
  return n > 900000 ? (n/1000000).toFixed(1) + " Mo" : Math.round(n/1000) + " Ko";
}

  v.appendChild(i);
  document.body.appendChild(v);
  function fin(){ v.remove(); }

  v.querySelector(".fermer").onclick = fin;
}

/* ══════════ Vue : séances du jour ══════════ */
function vueJour(){
  var date = view.date, cours = coursDuJour(date), d = new Date(date+"T12:00:00");
  var sem = semaineISO(d);
  var h = header(frLong(date), "Semaine "+sem+" · "+(sem%2 ? "impaire" : "paire"), false);

  h += '<div class="row" style="margin:14px 0 0">'
    + '<button class="btn sm" id="prevj">‹ Veille</button>'
    + '<button class="btn sm grow" id="auj">Aujourd\'hui</button>'
    + '<button class="btn sm" id="nextj">Lendemain ›</button></div>';

  }

  var excep = exceptionsDuJour(date);
  /* Cours habituels et créneaux exceptionnels sont mélangés dans l'ordre horaire :
     c'est la journée réelle qu'il faut lire d'un coup d'œil, pas deux listes. */
  var agenda = cours.map(function(c){ return {slot:c.slot, cours:c}; })
    .concat(excep.map(function(x){ return {slot:x.slot, excep:x}; }))
    .sort(function(a,b){ return ORDRE_SLOT.indexOf(a.slot) - ORDRE_SLOT.indexOf(b.slot); });

  h += '<div class="sect"><div class="stack">';
  if(!agenda.length) h += '<div class="empty">Pas de cours d\'EPS ce jour-là.</div>';
  agenda.forEach(function(it){
    if(it.excep){
      var x = it.excep;
      h += '<button class="course" data-exc="'+x.id+'" style="--c:#8A6508;--cs:#FBF0D2">'
        + '<span class="slot"><b>'+esc(x.slot.split("-")[0])+'</b>'

        + '<span class="cname">'+esc(x.libelle)+'</span>'
        + (x.note ? '<span class="capsa">'+esc(x.note)+'</span>' : '')
        + '</span><span class="chev">›</span></button>';
      return;
    }
    var c = it.cours;
    var cl = classeByNom(c.classe);
    var ap = cl ? apsaEnCours(cl.id, date, c.slot) : null;
    var n = cl ? elevesDe(cl.id).length : 0;
    h += '<button class="course" data-cours="'+esc(c.classe)+'|'+c.slot+'"'+styleClasse(c.classe)+'>'
      + '<span class="slot"><b>'+c.slot.split("-")[0]+'</b><span>'+SLOTS[c.slot]+'</span></span>'
    var sq = (cl && ap) ? seanceDuJour(cl.id, ap, date) : null;
    h += '<span class="body"><span class="cname">'+esc(c.classe)+'</span>'
      + '<span class="capsa">'+(ap ? esc(ap.nom) : '<span class="muted">APSA à définir</span>')
      + ' · '+n+' élève'+(n>1?"s":"")+'</span>'
      + (sq ? '<span class="capsa"><b>Séance '+sq.num+'/'+sq.total+'</b>'
          + (sq.fiche && sq.fiche.titre ? ' — '+esc(sq.fiche.titre) : ' — à préparer')+'</span>' : '')
      + '</span><span class="chev">›</span></button>';
  });
  h += '</div><button class="btn wide" id="addexc" style="margin-top:10px">'
    + '+ Cours exceptionnel</button></div>';

  var duJour = cours.map(function(c){ return c.classe; });
  var alertes = S.eleves.filter(function(e){
    var c = classeById(e.classeId);
    return c && duJour.indexOf(c.nom) >= 0 && oublisDepuisSanction(e.id) >= S.seuil;
  });
  if(alertes.length){

/* Interactions de la fiche : dépliages, cases « fait », minuteurs.
   Appelée après chaque rendu de la séance ; restaure le minuteur en cours. */
function brancherSeance(ap, sq, etapes){
  var bandeau = app.querySelector("#matbandeau");
  if(bandeau){
    bandeau.onclick = function(){
      var l = app.querySelector("#matliste");
      var ouvert = bandeau.getAttribute("aria-expanded") === "true";
      bandeau.setAttribute("aria-expanded", String(!ouvert));
      if(l) l.hidden = ouvert;
    };
  }
  each("[data-repli]", function(b){
    b.onclick = function(){
      var c = app.querySelector("#" + b.dataset.repli);
      var ouvert = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!ouvert));
      if(c) c.hidden = ouvert;
    };
  });

  if(!etapes || !ap || !sq) return;
  var cle = cleSeance(ap, sq.num);

  each("[data-fait]", function(b){
    b.onclick = function(){
      var i = b.dataset.fait;
      var reg = lireCleAnnexe(KEY_ETAPES, VERSION_ETAPES);
      if(!reg.seances[cle]) reg.seances[cle] = {};
      if(reg.seances[cle][i]) delete reg.seances[cle][i];
      else reg.seances[cle][i] = true;
      var fait = !!reg.seances[cle][i];
      ecrireCleAnnexe(KEY_ETAPES, reg);
      b.setAttribute("aria-pressed", String(fait));
      b.textContent = fait ? "✓" : "";
      var bloc = app.querySelector('[data-etape="' + i + '"]');
      if(bloc) bloc.className = "etape" + (fait ? " faite" : "");
    };
  });
  on("#decocher", function(){
    var reg = lireCleAnnexe(KEY_ETAPES, VERSION_ETAPES);
    delete reg.seances[cle];
    ecrireCleAnnexe(KEY_ETAPES, reg);
    render();
    toast("Étapes décochées");
  });

  each("[data-chr]", function(b){
    b.onclick = function(){
      var i = parseInt(b.dataset.i, 10);
      var mn = etapes[i].minutes;
      if(b.dataset.chr === "marche") lancerMinuteur(cle, i, mn);
      else if(b.dataset.chr === "pause") pauserMinuteur();
      else razMinuteur(cle, i, mn);
    };
  });
  each("[data-plein]", function(b){
    b.onclick = function(){
      var i = parseInt(b.dataset.plein, 10);
      ouvrirPlein(cle, i, etapes[i].num + " · " + etapes[i].titre, etapes[i].minutes);
    };
  });

  /* Retour sur la séance : on remet le minuteur là où il en est. */
  if(minuteur && minuteur.cle === cle && minuteur.i < etapes.length){
    peindreMinuteur();
    if(minuteur.marche){ arreterTic(); minuteurTic = setInterval(ticMinuteur, 250); }
  }
}

function bascule(eid, type, date){
  var i = -1;
  S.events.forEach(function(x,k){ if(x.eleveId===eid && x.date===date && x.type===type) i = k; });
  if(i >= 0){ S.events.splice(i,1); save(); render(); return; }
  S.events.push({id:uid(), eleveId:eid, type:type, date:date, texte:""});
  save();
  if(type === "oubli"){
    var c = oublisDepuisSanction(eid), e = eleveById(eid);
    render();
    if(c >= S.seuil) return poserSanction(eid);
    toast(e.prenom + " : " + c + " oubli" + (c>1?"s":"") + (c === S.seuil-1 ? " — le prochain déclenche la sanction" : ""));
    return;
  }
  render();
}

/* ══════════ Vue : cycle de séances d'une APSA ══════════ */
function deroulHTML(txt){
  return String(txt).split("\n").map(function(l){ return l.trim(); }).filter(Boolean)
    .map(function(l){
      var m = l.match(/^(?:[-•*]\s*)?(.*)$/);
      return '<span class="der-l">'+esc(m[1])+'</span>';
    }).join("");
}
/* ══════════ Séance exploitable en cours ══════════
   Rien n'est ajouté aux fiches de séance : elles gardent leurs cinq champs.
   Tout ce qui suit lit le texte du Déroulé au moment de l'affichage.
   Les cases cochées et le tirage vivent dans leurs propres clés. */
/* Tournois UNSS : clé annexe, déclarée ici avec les autres pour être connue
   de CLES_STOCKAGE et donc reprise dans les sauvegardes. */
var KEY_UNSS = "carnet-eps-unss-v1";
var VERSION_UNSS = 1;
var KEY_ETAPES = "carnet-eps-etapes-v1";
var KEY_TIRAGE = "carnet-eps-tirage-v1";
var VERSION_ETAPES = 1;
var VERSION_TIRAGE = 1;

function lireCleAnnexe(cle, version){
  var o = null;
  try { o = JSON.parse(localStorage.getItem(cle)); } catch(e){ o = null; }
  if(!o || typeof o !== "object" || o.version !== version) o = {version:version, seances:{}};
  if(!o.seances || typeof o.seances !== "object") o.seances = {};
  return o;
}
function ecrireCleAnnexe(cle, obj){
  try { localStorage.setItem(cle, JSON.stringify(obj)); return true; }
  catch(e){ toast("Stockage plein : rien n'a été enregistré"); return false; }
}
/* Les fiches n'ont pas d'identifiant propre : on le dérive, sans rien y écrire. */
function cleSeance(ap, num){ return ap.id + "#" + num; }
function cleTirage(cl, ap, sq){
  return (ap && sq) ? cleSeance(ap, sq.num) : "classe:" + cl.id + "#" + view.date;
}

/* ── Analyse du Déroulé ──
   Une étape : "3. LA BALLE NE TOMBE PAS — 20 min".
   Retourne null dès que le texte ne suit pas la convention : la séance
   s'affiche alors exactement comme avant, en texte brut. */
var RE_ETAPE = /^(\d{1,2})\s*[.)]\s*(.+?)\s*[—–-]\s*(\d{1,3})\s*(?:min|mn|')\s*\.?$/i;
var QUALIFIES = [
  {cle:"reussite",    re:/^r[ée]ussite\s*:\s*/i,     lbl:"Réussite",     cls:"q-reussite"},
  {cle:"realisation", re:/^r[ée]alisation\s*:\s*/i,  lbl:"Réalisation",  cls:"q-realisation"},
  {cle:"simplifier",  re:/^simplifier\s*:\s*/i,      lbl:"Simplifier",   cls:""},
  {cle:"complexifier",re:/^complexifier\s*:\s*/i,    lbl:"Complexifier", cls:""}
];

function analyserDeroule(txt){
  var lignes = String(txt).split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lignes.length) return null;
  var etapes = [], courante = null, i, j, m, ligne, place;
  for (i = 0; i < lignes.length; i++){
    ligne = lignes[i];
    m = ligne.match(RE_ETAPE);
    if(m){
      courante = {num:m[1], titre:m[2], minutes:parseInt(m[3], 10),
                  consignes:[], reussite:[], realisation:[], simplifier:[], complexifier:[]};
      etapes.push(courante);
      continue;
    }
    /* Du texte avant la première étape : le déroulé ne suit pas la convention. */
    if(!courante) return null;
    place = false;
    for (j = 0; j < QUALIFIES.length; j++){
      if(QUALIFIES[j].re.test(ligne)){
        courante[QUALIFIES[j].cle].push(ligne.replace(QUALIFIES[j].re, "").trim());
        place = true;
        break;
      }
    }
    if(!place) courante.consignes.push(ligne.replace(/^[-•*]\s*/, ""));
  }
  return etapes.length ? etapes : null;
}

/* ── Matériel replié ── */
function elementsMateriel(txt){
  return String(txt).split(/[,;\n]/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function materielHTML(txt){
  var l = elementsMateriel(txt);
  if(!l.length) return '';
  return '<button class="mat-bandeau" id="matbandeau" aria-expanded="false">'
    + '<span class="fl">▶</span><span class="grow">Matériel · ' + l.length
    + ' élément' + (l.length > 1 ? 's' : '') + '</span></button>'
    + '<ul class="mat-liste" id="matliste" hidden>'
    + l.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
}

/* ── Rendu des étapes ── */
function mmss(ms){
  var s = Math.max(0, Math.round(ms / 1000));
  var m = Math.floor(s / 60);
  s = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function blocRepli(id, lbl, lignes){
  if(!lignes.length) return '';
  return '<button class="repli" data-repli="' + id + '" aria-expanded="false">'
    + '<span class="fl">▶</span><span class="grow">' + lbl + ' (' + lignes.length + ')</span></button>'

/* ── Minuteur ──
   L'échéance est un horodatage absolu : la mise en veille de la tablette ne
   fausse rien. Il vit dans une variable de module, donc il survit à un
   changement d'écran, mais pas à un rechargement de la page. */
var minuteur = null;
var minuteurTic = null;

function arreterTic(){
  if(minuteurTic){ clearInterval(minuteurTic); minuteurTic = null; }
}
function restantMinuteur(){
  if(!minuteur) return 0;
  return minuteur.marche ? Math.max(0, minuteur.fin - Date.now()) : minuteur.restant;
}
function peindreMinuteur(){
  if(!minuteur){ peindrePlein(); return; }
  var el = document.getElementById("chrono-" + minuteur.i);
  if(el){
    var r = restantMinuteur();
    el.textContent = mmss(r);
    el.className = "chrono-t" + (r <= 0 ? " fini" : (minuteur.marche ? " marche" : ""));
  }
  peindrePlein();
}
function ticMinuteur(){
  if(!minuteur) return arreterTic();
  if(minuteur.marche && minuteur.fin - Date.now() <= 0){
    minuteur.marche = false; minuteur.restant = 0;
    peindreMinuteur();
    arreterTic();
    return;
  }
  peindreMinuteur();
}
function lancerMinuteur(cle, i, minutes){
  /* Un seul minuteur à la fois : démarrer ailleurs remplace le précédent,
     et remet son affichage à sa durée de départ pour ne pas laisser croire
     que deux étapes tournent en même temps. */
  if(!minuteur || minuteur.cle !== cle || minuteur.i !== i){
    if(minuteur && minuteur.cle === cle){
      var ancien = document.getElementById("chrono-" + minuteur.i);
      if(ancien){
        ancien.textContent = mmss(minuteur.minutes * 60000);
        ancien.className = "chrono-t";
      }
    }
    minuteur = {cle:cle, i:i, minutes:minutes, restant:minutes * 60000, marche:false, fin:0};
  }
  if(restantMinuteur() <= 0) minuteur.restant = minutes * 60000;
  minuteur.fin = Date.now() + minuteur.restant;
  minuteur.marche = true;
  arreterTic();
  minuteurTic = setInterval(ticMinuteur, 250);
  peindreMinuteur();
}
function pauserMinuteur(){
  if(!minuteur || !minuteur.marche) return;
  minuteur.restant = restantMinuteur();
  minuteur.marche = false;
  arreterTic();
  peindreMinuteur();
}
function razMinuteur(cle, i, minutes){
  if(minuteur && minuteur.cle === cle && minuteur.i === i){ arreterTic(); minuteur = null; }
  var el = document.getElementById("chrono-" + i);
  if(el){ el.textContent = mmss(minutes * 60000); el.className = "chrono-t"; }
  peindrePlein();
}

/* ── Minuteur en grand ──
   Une couche fixe par-dessus l'appli, pilotée par le MÊME minuteur : elle ne
   compte rien de son côté, elle affiche l'état de la variable `minuteur`. */
var plein = null;
var veille = null;

function prendreVeille(){
  /* Empêche l'écran de s'éteindre pendant l'affichage. Absente sur certains
     navigateurs : dans ce cas on ne fait rien et on ne dit rien. */
  try {
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request("screen").then(function(s){ veille = s; },
        function(){ veille = null; });
    }
  } catch(e){ veille = null; }
}
function rendreVeille(){
  try { if(veille && veille.release) veille.release(); } catch(e){}
  veille = null;
}
function pleinEstLeSien(){
  return !!(plein && minuteur && minuteur.cle === plein.cle && minuteur.i === plein.i);
}
function peindrePlein(){
  if(!plein) return;
  var t = document.getElementById("plein-t");
  if(!t) return;
  var sien = pleinEstLeSien();
  var r = sien ? restantMinuteur() : plein.minutes * 60000;
  var marche = sien && minuteur.marche;
  t.textContent = mmss(r);
  t.className = "plein-t" + (r <= 0 ? " fini" : (marche ? " marche" : ""));
  var b = document.getElementById("plein-pause");
  if(b){
    b.textContent = marche ? "Pause" : "Reprendre";
    b.className = marche ? "" : "primaire";
  }
}
function fermerPlein(){
  var el = document.getElementById("plein");
  if(el) el.parentNode.removeChild(el);
  plein = null;
  rendreVeille();
}
function ouvrirPlein(cle, i, titre, minutes){
  fermerPlein();
  plein = {cle:cle, i:i, titre:titre, minutes:minutes};
  var d = document.createElement("div");
  d.className = "plein";
  d.id = "plein";
  d.innerHTML = '<button class="plein-x" id="plein-x" aria-label="Revenir à la séance">✕</button>'
    + '<div class="plein-titre">' + esc(titre) + '</div>'
    + '<div class="plein-t" id="plein-t">' + mmss(minutes * 60000) + '</div>'
    + '<div class="plein-btns">'
    + '<button id="plein-pause">Pause</button>'
    + '<button id="plein-raz">Remise à zéro</button></div>';
  document.body.appendChild(d);
  d.querySelector("#plein-x").onclick = fermerPlein;
  d.querySelector("#plein-pause").onclick = function(){
    if(pleinEstLeSien() && minuteur.marche) pauserMinuteur();
    else lancerMinuteur(plein.cle, plein.i, plein.minutes);
    peindrePlein();
  };
  d.querySelector("#plein-raz").onclick = function(){
    razMinuteur(plein.cle, plein.i, plein.minutes);
  };
  prendreVeille();
  peindrePlein();
}

/* ── Tirage au sort ──
   Les noms viennent de la liste déjà enregistrée pour la classe, filtrée
   comme à l'écran. Une seule liste de « déjà tirés » par séance, quel que
   soit le groupe affiché. */
function exclusDuTirage(e, date){
  if(S.events.some(function(x){
    return x.eleveId === e.id && x.date === date && (x.type === "absent" || x.type === "dispense");
  })) return true;
  return !!dispenseActive(e.id, date);
}
function sheetTirage(cl, ap, sq, els, date){
  var cle = cleTirage(cl, ap, sq);
  var reg = lireCleAnnexe(KEY_TIRAGE, VERSION_TIRAGE);
  var anim = null;

  function tires(){ return reg.seances[cle] || []; }
  function dispos(){
    return els.filter(function(e){
      return tires().indexOf(e.id) < 0 && !exclusDuTirage(e, date);
    });
  }
  function nomComplet(e){ return e.prenom ? e.prenom + " " + e.nom.toUpperCase() : e.nom; }

  function texteCompteur(){
    var n = tires().length;
    var exclus = els.filter(function(e){ return exclusDuTirage(e, date); }).length;
    return '<b class="tirage-cpt">' + n + ' / ' + els.length + '</b> déjà tirés'
      + (exclus ? ' · ' + exclus + ' exclu' + (exclus > 1 ? 's' : '') + ' (absent ou dispensé)' : '');
  }
  function majCompteur(){
    var p = document.getElementById("tcpt");
    if(p) p.innerHTML = texteCompteur();
  }
  function corps(){
    return '<div class="tirage-nom" id="tnom"><span class="pre">Prêt ?</span></div>'
      + '<p class="muted" id="tcpt" style="margin:0;font-size:13px">' + texteCompteur() + '</p>'
      + '<button class="btn primary wide" id="tirer">Tirer un élève</button>'
      + '<button class="btn wide ghost" id="raztirage">Réinitialiser le tirage</button>';
  }

  function brancher(root){
    var zone = root.querySelector("#tnom");
    root.querySelector("#raztirage").onclick = function(){
      delete reg.seances[cle];
      ecrireCleAnnexe(KEY_TIRAGE, reg);
      root.innerHTML = corps(); brancher(root);
      toast("Tirage remis à zéro");
    };
    root.querySelector("#tirer").onclick = function(){
      if(anim) return;
      var d = dispos();
      if(!d.length){
        var exclus = els.filter(function(e){ return exclusDuTirage(e, date); }).length;
        zone.innerHTML = '<span class="pre" style="font-size:22px">'
          + (els.length && exclus === els.length
              ? "Tous les élèves affichés sont absents ou dispensés"
              : "Toute la classe est passée")
          + '<small>Réinitialise le tirage pour recommencer</small></span>';
        return;
      }
      /* Défilement rapide qui ralentit jusqu'à l'arrêt, environ 2 secondes. */
      var debut = Date.now(), duree = 2000, pas = 55;
      anim = function(){
        var t = (Date.now() - debut) / duree;
        if(t >= 1){
          anim = null;
          var choisi = d[Math.floor(Math.random() * d.length)];
          if(!reg.seances[cle]) reg.seances[cle] = [];
          reg.seances[cle].push(choisi.id);
          ecrireCleAnnexe(KEY_TIRAGE, reg);
          zone.innerHTML = '<span class="pre">' + esc(nomComplet(choisi))
            + '<small>' + tires().length + ' / ' + els.length + ' déjà tirés</small></span>';
          majCompteur();
          return;
        }
        zone.innerHTML = '<span class="pre">' + esc(d[Math.floor(Math.random() * d.length)].prenom || "—") + '</span>';
        pas = 55 + 260 * t * t;
        setTimeout(anim, pas);
      };
      anim();
    };
  }

  ouvrirSheet("Tirer un élève — " + esc(cl.nom),
    '<div id="tzone"></div>',
    function(root){
      var z = root.querySelector("#tzone");
      z.innerHTML = corps();
      brancher(z);
    });
}

/* ══════════ Documents de référence et recherche ══════════ */
var CATEGORIES = ["Projet d'établissement","Programmes et textes","Calendrier",
                  "Sécurité et protocoles","Vie scolaire","Autre"];
var VIDES = ["le","la","les","un","une","des","du","de","au","aux","et","ou","en","dans","sur",
  "pour","par","avec","que","qui","quoi","quel","quelle","quelles","quels","est","sont","ce",
  "cette","ces","son","sa","ses","mon","ma","mes","il","elle","on","nous","vous","ils","elles",
  "a","à","dit","dis","comment","pourquoi","est-ce","y","d","l","n","se","plus","moins","je","tu"];

function sansAccents(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
/* On cherche sur la racine du mot : « absente » doit retrouver « absences ». */
function racine(m){
  if(m.length <= 4) return m;
  return m.slice(0, Math.max(4, m.length - 2));
}
function motsUtiles(q){
  return sansAccents(q).split(/[^a-z0-9]+/)
    .filter(function(m){ return m.length > 2 && VIDES.indexOf(m) < 0; })
    .map(racine);
}
function paragraphes(txt){
  return String(txt).split(/\n\s*\n|\n/).map(function(p){ return p.trim(); })
    .filter(function(p){ return p.length > 1; });
}
/* Recherche : on classe les paragraphes par nombre de mots de la question retrouvés. */
function chercherDocs(q){
  var mots = motsUtiles(q);
  if(!mots.length) return [];
  var res = [];
  (S.docs || []).forEach(function(d){
    paragraphes(d.texte).forEach(function(p, i){
      var np = sansAccents(p), score = 0;
      mots.forEach(function(m){ if(np.indexOf(m) >= 0) score++; });
      if(score) res.push({doc:d, para:p, index:i, score:score,
        exact:np.indexOf(sansAccents(q).trim()) >= 0 ? 1 : 0});
    });
  });
  return res.sort(function(a, b){
    return (b.score - a.score) || (b.exact - a.exact) || (a.para.length - b.para.length);
  }).slice(0, 25);
}
function surligner(texte, q){
  var mots = motsUtiles(q);
  if(!mots.length) return esc(texte);
  var np = sansAccents(texte), marques = [];
  mots.forEach(function(m){
    var i = 0;
    while((i = np.indexOf(m, i)) >= 0){
      /* On surligne le mot entier, pas seulement la racine trouvée. */
      var fin = i + m.length;
      while(fin < np.length && /[a-z0-9]/.test(np[fin])) fin++;
      marques.push([i, fin]);
      i = fin;
    }
  });
  if(!marques.length) return esc(texte);
  marques.sort(function(a, b){ return a[0] - b[0]; });
  var fus = [marques[0]];
  marques.slice(1).forEach(function(m){
    var d = fus[fus.length - 1];
    if(m[0] <= d[1]) d[1] = Math.max(d[1], m[1]); else fus.push(m);
  });
  var out = "", pos = 0;
  fus.forEach(function(m){
    out += esc(texte.slice(pos, m[0])) + '<mark>' + esc(texte.slice(m[0], m[1])) + '</mark>';
    pos = m[1];
  });
  return out + esc(texte.slice(pos));
}

/* ══════════ Vue : rappels ══════════ */
function rappelsTries(){
  return (S.rappels || []).slice().sort(function(a,b){
    return a.date.localeCompare(b.date) || a.id.localeCompare(b.id);
  });
}
function rappelsActifs(){ return rappelsTries().filter(function(r){ return !r.fait; }); }
function rappelsDuJour(date){
  return rappelsActifs().filter(function(r){ return r.date === date; });
}
function rappelsEnRetard(date){
  return rappelsActifs().filter(function(r){ return r.date < date; });
}
function joursAvant(date){
  return Math.round((new Date(date+"T12:00:00") - new Date(AUJ()+"T12:00:00")) / 86400000);
}
function echeance(r){
  var j = joursAvant(r.date);
  if(j < 0) return {txt:"en retard de " + (-j) + " j", cls:"b-alert"};
  if(j === 0) return {txt:"aujourd'hui", cls:"b-alert"};
  if(j === 1) return {txt:"demain", cls:"b-warn"};
  if(j <= 7) return {txt:"dans " + j + " jours", cls:"b-warn"};
  return {txt:"dans " + j + " jours", cls:"b-quiet"};
}

function ligneRappel(r){
  var e = echeance(r);
  var cl = r.classeId ? classeById(r.classeId) : null;
  return '<div class="rap'+(r.fait ? " fait" : "")+'">'
    + '<button class="coche'+(r.fait ? " on" : "")+'" data-ok="'+r.id+'" aria-label="Marquer comme fait">'
    + (r.fait ? "✓" : "") + '</button>'
    + '<button class="grow linkish" data-red="'+r.id+'">'
    + '<b>'+esc(r.titre)+'</b><br>'
    + '<span class="meta num">'+frDate(r.date)+'</span> '
    + '<span class="badge '+e.cls+'">'+e.txt+'</span>'
    + (cl ? ' <span class="badge b-classe"'+styleClasse(cl.nom)+'>'+esc(cl.nom)+'</span>' : '')
    + (r.note ? '<span class="rnote">'+esc(r.note)+'</span>' : '')
    + '</button></div>';
}

function vueRappels(){
  var auj = AUJ();
  var actifs = rappelsActifs();
  var retard = actifs.filter(function(r){ return r.date < auj; });
  var jour   = actifs.filter(function(r){ return r.date === auj; });
  var semaine = actifs.filter(function(r){ return r.date > auj && joursAvant(r.date) <= 7; });
  var suite  = actifs.filter(function(r){ return joursAvant(r.date) > 7; });
  var faits  = rappelsTries().filter(function(r){ return r.fait; }).reverse();

  var h = header("Rappels", actifs.length + " à venir", false);
  h += '<div class="sect"><div class="stack" style="gap:8px">'
    + '<button class="btn primary wide" id="addr">+ Nouveau rappel</button>'
    + '<div class="row"><button class="btn sm grow" id="coller">Coller un mail</button>'
    + '<button class="btn sm grow" id="ics">Envoyer vers mon agenda</button></div></div></div>';

  function bloc(titre, l){
    if(!l.length) return "";
    return '<div class="sect"><span class="eyebrow">'+titre+'</span><div class="stack" style="gap:8px">'
      + l.map(ligneRappel).join("") + '</div></div>';
  }
  h += bloc("En retard", retard);
  h += bloc("Aujourd'hui", jour);
  h += bloc("Cette semaine", semaine);
  h += bloc("Plus tard", suite);

  if(!actifs.length){
    h += '<div class="sect"><div class="empty">Aucun rappel en attente.<br>'
      + 'Note ici tout ce qui a une date : réunion parents, remise des notes, sortie, conseil de classe, brevet blanc…</div></div>';
  }
  if(faits.length){
    h += '<div class="sect"><span class="eyebrow">Faits ('+faits.length+')</span><div class="stack" style="gap:8px">'
      + faits.slice(0, 20).map(ligneRappel).join("") + '</div>'
      + '<button class="btn sm wide" id="purge" style="margin-top:10px">Effacer les rappels faits</button></div>';
  }

  app.innerHTML = h;
  on("#addr", function(){ sheetRappel(null); });
  on("#coller", sheetColler);
  on("#ics", exporterAgenda);
  on("#purge", function(){
    S.rappels = (S.rappels || []).filter(function(r){ return !r.fait; });
    save(); render(); toast("Rappels faits effacés");
  });
  each("[data-ok]", function(b){
    b.onclick = function(){
      var r = (S.rappels || []).filter(function(x){ return x.id === b.dataset.ok; })[0];
      if(!r) return;
      r.fait = !r.fait; save(); render();
      toast(r.fait ? "Fait : " + r.titre : "Remis en attente");
    };
  });
  each("[data-red]", function(b){ b.onclick = function(){ sheetRappel(b.dataset.red); }; });
}

/* ── Extraction des dates d'un mail collé ── */
var MOIS = {janvier:1,"février":2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,"août":8,aout:8,
  septembre:9,octobre:10,novembre:11,"décembre":12,decembre:12};
function anneeProbable(m, j){
  var auj = new Date(), a = auj.getFullYear();
  var d = new Date(a, m - 1, j);
  /* Une date déjà passée de plus d'un mois désigne l'année suivante. */
  if((auj - d) / 86400000 > 31) a++;
  return a;
}
function detecterDates(txt){
  var lignes = String(txt).split(/[\n\r]+|(?<=[.;!?])\s+/)
    .map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 2; });
  var vus = {}, out = [];
  lignes.forEach(function(ligne){
    var d = null;
    var m = ligne.match(/\b(\d{1,2})\s*[\/.-]\s*(\d{1,2})(?:\s*[\/.-]\s*(\d{2,4}))?\b/);
    if(m){
      var jj = +m[1], mm = +m[2], aa = m[3] ? +m[3] : null;
      if(aa !== null && aa < 100) aa += 2000;
      if(jj >= 1 && jj <= 31 && mm >= 1 && mm <= 12){
        d = (aa || anneeProbable(mm, jj)) + "-" + ("0"+mm).slice(-2) + "-" + ("0"+jj).slice(-2);
      }
    }
    if(!d){
      var re = new RegExp("\\b(\\d{1,2})(?:er)?\\s+(" + Object.keys(MOIS).join("|") + ")(?:\\s+(\\d{4}))?\\b", "i");
      var n = ligne.match(re);
      if(n){
        var j2 = +n[1], m2 = MOIS[n[2].toLowerCase()], a2 = n[3] ? +n[3] : anneeProbable(m2, j2);
        d = a2 + "-" + ("0"+m2).slice(-2) + "-" + ("0"+j2).slice(-2);
      }
    }
    if(!d) return;
    var h = ligne.match(/\b(\d{1,2})\s*h\s*(\d{2})?\b/i);
    /* Nettoyage du bruit d'ENT : chevrons de citation, puces, en-têtes de message. */
    var titre = ligne
      .replace(/^[>»\-–—*•·\s]+/, "")
      .replace(/^(objet|de|à|a|envoyé|envoye|date|cc|copie)\s*:\s*/i, "")
      .replace(/^(bonjour|bonsoir|madame|monsieur|chers?\s+coll[èe]gues)[,\s]+/i, "")
      .replace(/\s+/g, " ").trim();
    if(!titre) titre = ligne.replace(/\s+/g, " ").trim();
    if(titre.length > 90) titre = titre.slice(0, 88) + "…";
    var cle = d + "|" + titre.toLowerCase();
    if(vus[cle]) return;
    vus[cle] = true;
    out.push({date:d, titre:titre, heure:h ? (h[1] + "h" + (h[2] || "")) : ""});
  });
  return out.sort(function(a,b){ return a.date.localeCompare(b.date); });
}

/* ── Export vers l'agenda du téléphone (.ics) ── */
function exporterAgenda(){
  var l = rappelsActifs();
  if(!l.length) return toast("Aucun rappel à exporter");
  function pack(s){ return String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
  var lignes = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Carnet EPS//FR","CALSCALE:GREGORIAN"];
  l.forEach(function(r){
    var d = r.date.replace(/-/g, "");
    var fin = new Date(r.date+"T12:00:00"); fin.setDate(fin.getDate()+1);
    var cl = r.classeId ? classeById(r.classeId) : null;
    lignes.push("BEGIN:VEVENT",
      "UID:" + r.id + "@carnet-eps",
      "DTSTAMP:" + AUJ().replace(/-/g,"") + "T080000Z",
      "DTSTART;VALUE=DATE:" + d,
      "DTEND;VALUE=DATE:" + iso(fin).replace(/-/g,""),
      "SUMMARY:" + pack(r.titre + (cl ? " (" + cl.nom + ")" : "")),
      "DESCRIPTION:" + pack(r.note || ""),
      "BEGIN:VALARM","TRIGGER:-PT15H","ACTION:DISPLAY","DESCRIPTION:" + pack(r.titre),"END:VALARM",
      "END:VEVENT");
  });
  lignes.push("END:VCALENDAR");
  var data = lignes.join("\r\n");
  var use = window.claude && window.claude.use ? window.claude.use("downloads") : null;
  Promise.resolve(use).then(function(dl){
    if(dl && dl.save) return dl.save({filename:"rappels-eps.ics", data:data})
      .then(function(){ toast("Ouvre le fichier pour l'ajouter à ton agenda"); });
    return navigator.clipboard.writeText(data).then(function(){ toast("Agenda copié dans le presse-papier"); });
  }).catch(function(){ toast("Export refusé ou indisponible sur cet appareil"); });
}

function choisirApsaGroupes(c, actuelle){
  var l = S.apsa.filter(function(a){ return a.classeId === c.id; })
    .sort(function(a,b){ return (b.debut||"").localeCompare(a.debut||""); });
  ouvrirSheet("Groupes de quelle APSA ?",
    '<div class="plist">' + l.map(function(a){
      var n = niveauxDe(a).length;
      return '<button class="prow" data-ap="'+a.id+'"><span class="grow truncate">'
        + '<span class="nm">'+esc(a.nom)+'</span><br><span class="meta num">'+frDate(a.debut)+' → '+frDate(a.fin)
        + ' · ' + (n ? n+" groupes" : "aucun groupe") + '</span></span>'
        + (a.id === actuelle.id ? '<span class="badge b-accent">affichée</span>' : '')
        + '</button>';

/* ══════════ Vue : une classe ══════════ */
function vueClasse(){
  var c = classeById(view.id);
  if(!c) return go({n:"classes"});
  var els = elevesDe(c.id);
  var sousTitre = els.length + " élève" + (els.length>1?"s":"")
    + (estGroupe(c) ? " · groupe de " + classeParente(c).nom : "");
  var h = header(c.nom, sousTitre, true, c.nom);
  var sty = styleClasse(c.nom);

  h += '<div class="sect"'+sty+'><span class="eyebrow">APSA programmées</span><div class="plist">';
  var aps = S.apsa.filter(function(a){ return a.classeId===c.id; })
    .sort(function(a,b){ return (a.debut||"").localeCompare(b.debut||""); });
  if(!aps.length) h += '<div class="empty">Aucune APSA programmée.<br>Exemple : « Natation, du 15/09 au 15/10 ».</div>';
  aps.forEach(function(a){
    var enc = (!a.debut || a.debut<=AUJ()) && (!a.fin || a.fin>=AUJ());
    var nbS = datesSeances(c.id, a).length;
    var faites = datesSeances(c.id, a).filter(function(d){ return d.date < AUJ(); }).length;
    h += '<button class="prow" data-apsa="'+a.id+'"><span class="grow truncate"><span class="nm">'+esc(a.nom)+'</span><br>'
      + '<span class="meta num">'+frDate(a.debut)+' → '+frDate(a.fin)+' · '
      + (enc ? "séance "+Math.min(faites+1, nbS)+"/"+nbS : nbS+" séances") + '</span>'
      + (a.creneau ? '<span class="meta">'+esc(libelleCreneau(a.creneau))+' uniquement</span>' : '')
      + '</span>'
      + (enc ? '<span class="badge b-ok">en cours</span>' : '')
      + '<span class="chev">›</span></button>';
  });
  h += '</div><div class="row" style="margin-top:10px">'
    + '<button class="btn sm grow" id="addapsa">+ APSA</button>'
    + '<button class="btn sm grow" id="editc">Réglages classe</button></div></div>';

  h += '<div class="sect"'+sty+'><span class="eyebrow">Élèves</span><div class="plist">';
  if(!els.length) h += '<div class="empty">Liste vide.</div>';
  els.forEach(function(e){
    var o = oublisDepuisSanction(e.id), tot = nbOublis(e.id), m = moyenne(e.id);
    h += '<button class="prow" data-e="'+e.id+'">'
      + '<span class="avatar '+(o>=S.seuil?"alert":(o===S.seuil-1?"warn":""))+'">'+esc(initiales(e))+'</span>'
      + '<span class="grow truncate"><span class="nm">'+esc(e.nom.toUpperCase())+' '+esc(e.prenom)+'</span><br>'
      + '<span class="meta">'+tot+' oubli'+(tot>1?"s":"")+(c.noter && m ? " · moy. "+m+"/20" : "")+'</span></span>'
      + (o>=S.seuil ? '<span class="badge b-alert">sanction</span>' : '')
      + '<span class="chev">›</span></button>';
  });
  h += '</div><div class="row" style="margin-top:10px">'
    + '<button class="btn sm grow" id="addel">'+(estGroupe(c) ? "Composition du groupe" : "+ Élèves")+'</button>'
    + '<button class="btn sm grow" id="seance">Ouvrir une séance</button></div>'
    + (function(){
        var apc = apsaCourante(c.id);
        if(!apc) return '';
        var n = niveauxDe(apc).length;
        return '<button class="btn wide" id="niveaux" style="margin-top:8px">'
          + (n ? "Groupes de niveau — " + esc(apc.nom) + " (" + n + ")"
               : "Créer des groupes de niveau en " + esc(apc.nom)) + '</button>';
      })()
    + '</div>';

  app.innerHTML = h;
  on("#back", function(){ go({n:"classes"}); });

  on("#addel", function(){ estGroupe(c) ? sheetComposition(c.id) : sheetImportEleves(c.id); });
  on("#seance", function(){ go({n:"seance", classeId:c.id, date:AUJ()}); });
  on("#niveaux", function(){
    var apc = apsaCourante(c.id);
    go({n:"groupes", classeId:c.id, apsaId:apc ? apc.id : null, from:{n:"classe", id:c.id}});
  });
  each("[data-e]", function(b){ b.onclick = function(){ go({n:"eleve", id:b.dataset.e, from:{n:"classe", id:c.id}}); }; });
  each("[data-apsa]", function(b){
    b.onclick = function(){ go({n:"cycle", classeId:c.id, apsaId:b.dataset.apsa, from:{n:"classe", id:c.id}}); };
  });
}
