/* ══════════ Vue : fiche élève ══════════ */
function vueEleve(){
  var e = eleveById(view.id);
  if(!e) return go({n:"eleves"});
  var cl = classeById(e.classeId);
  var o = oublisDepuisSanction(e.id);
  var m = moyenne(e.id);
  var rems = S.events.filter(function(x){ return x.eleveId===e.id && (x.type==="remarque"||x.type==="positif"); }).length;

  var sty = styleClasse(cl ? cl.nom : "");
  var h = header(e.prenom + " " + e.nom.toUpperCase(), cl ? cl.nom : "", true, cl ? cl.nom : null);
  h += '<div class="sect"'+sty+'><div class="hero"><div class="row">'
    + '<span class="avatar '+(o>=S.seuil?"alert":(o===S.seuil-1?"warn":""))+'" style="width:48px;height:48px;font-size:16px">'+esc(initiales(e))+'</span>'
    + '<div class="grow truncate"><div class="nm">'+esc(e.prenom)+' '+esc(e.nom.toUpperCase())+'</div>'
    + '<div class="muted" style="font-size:13px">'+esc(cl?cl.nom:"")
    + (cl && !cl.noter ? " · évalué par compétences" : "") + '</div></div>'
    + '<button class="btn sm" id="edite">Modifier</button></div>'
    + '<div class="stats">'
    + '<div class="stat '+(o>=S.seuil?"is-alert":(o===S.seuil-1?"is-warn":""))+'"><b class="num">'+o+'/'+S.seuil+'</b><span>OUBLIS EN COURS</span></div>'
    + '<div class="stat is-note"><b class="num">'+(cl && cl.noter ? (m||"—") : "—")+'</b><span>MOYENNE /20</span></div>'
    + '<div class="stat is-rem"><b class="num">'+rems+'</b><span>REMARQUES</span></div></div>';
  if(o >= S.seuil){
    h += '<div class="sanction" style="margin-top:14px"><span style="font-size:20px">⚠</span><div class="grow">'
      + '<b>Seuil de sanction atteint</b><p>'+o+' oublis depuis la dernière sanction.</p>'
      + '<button class="btn sm primary" id="sanc" style="margin-top:10px">Poser la sanction</button></div></div>';
  }
  h += '</div></div>';

  var ongl = [["suivi","Suivi"]];
  if(cl && cl.noter) ongl.push(["notes","Notes"]);
  ongl.push(["comp","Compétences"]);
  if(!ongl.some(function(x){ return x[0]===ongletFiche; })) ongletFiche = "suivi";
  h += '<div class="tabs"'+sty+'>' + ongl.map(function(x){
    return '<button data-o="'+x[0]+'" aria-selected="'+(ongletFiche===x[0])+'">'+x[1]+'</button>';
  }).join("") + '</div>';

  h += '<div class="sect"'+sty+'><div class="stack" style="gap:8px">';

  if(ongletFiche === "suivi"){
    var LBL = {oubli:["Oubli de tenue","b-warn"], absent:["Absent","b-alert"],
      dispense:["Dispensé","b-accent"], remarque:["Remarque","b-quiet"],
      sanction:["Sanction posée","b-alert"], positif:["Point positif","b-ok"]};
    var evs = S.events.filter(function(x){ return x.eleveId===e.id; })
      .sort(function(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
    if(!evs.length) h += '<div class="empty">Rien à signaler pour l\'instant.</div>';
    evs.forEach(function(x){
      var L = LBL[x.type] || ["Événement","b-quiet"];
      h += '<div class="item"><div class="row"><span class="badge '+L[1]+'">'+L[0]+'</span>'
        + '<span class="when num grow">'+frDate(x.date)+'</span>'
        + '<button class="btn sm ghost" data-del="'+x.id+'" aria-label="Supprimer">✕</button></div>'
        + (x.texte ? '<p>'+esc(x.texte)+'</p>' : '') + '</div>';
    });
    h += '</div><div class="row" style="margin-top:12px">'
      + '<button class="btn sm grow" id="addrem">+ Remarque</button>'
      + '<button class="btn sm grow" id="addpos">+ Positif</button>'
      + '<button class="btn sm grow" id="addoub">+ Oubli</button></div></div>';

    var perfs = perfsDe(e.id);
    if(perfs.length){
      h += '<div class="sect"'+sty+'><span class="eyebrow">Performances</span><div class="stack" style="gap:8px">'
        + perfs.slice(0, 20).map(function(p){
            var ep = epreuveById(p.epreuveId);
            var b = meilleurEssai(p.essais, ep.sens);
            var det = (p.essais || []).map(function(v){ return v == null ? "—" : nombreFr(v); }).join(" · ");
            return '<div class="note-line"><span class="note-val">'+(b == null ? "—" : nombreFr(b))
              + '<small> '+ep.unite+'</small></span>'
              + '<span class="grow truncate"><b style="font-size:14px">'+esc(ep.nom)+'</b><br>'
              + '<span class="muted num" style="font-size:12px">'+frDate(p.date)+' · essais '+det+'</span></span></div>';
          }).join("") + '</div></div>';
    }

    var disps = dispensesDe(e.id);
    h += '<div class="sect"'+sty+'><span class="eyebrow">Dispenses</span><div class="stack" style="gap:8px">';
    if(!disps.length) h += '<div class="empty">Aucune dispense enregistrée.</div>';
    h += disps.map(function(d){ return ligneDispense(d, false); }).join("")
      + '</div><button class="btn wide" id="adddisp" style="margin-top:10px">'
      + '+ Photographier une dispense</button></div>';
  }

  if(ongletFiche === "notes"){
    var notes = S.notes.filter(function(n){ return n.eleveId===e.id; })
      .sort(function(a,b){ return b.date.localeCompare(a.date); });
    if(!notes.length) h += '<div class="empty">Aucune note enregistrée.</div>';
    notes.forEach(function(n){
      var a = S.apsa.filter(function(x){ return x.id===n.apsaId; })[0];
      h += '<div class="note-line"><span class="note-val">'+n.valeur+'<small>/'+n.sur+'</small></span>'
        + '<span class="grow truncate"><b style="font-size:14px">'+esc(n.libelle || (a?a.nom:"Évaluation"))+'</b><br>'
        + '<span class="muted num" style="font-size:12px">'+(a?esc(a.nom)+" · ":"")+frDate(n.date)+'</span></span>'
        + '<button class="btn sm ghost" data-deln="'+n.id+'" aria-label="Supprimer">✕</button></div>';
    });
    h += '</div><div class="sect"><button class="btn wide" id="addnote">+ Ajouter une note</button></div>';
  }

  if(ongletFiche === "comp"){
    S.competences.forEach(function(c){
      var rec = S.comps.filter(function(x){ return x.eleveId===e.id && x.compId===c.id; })
        .sort(function(a,b){ return b.date.localeCompare(a.date); })[0];
      var apn = rec && rec.apsaId ? (S.apsa.filter(function(a){return a.id===rec.apsaId})[0]||{}).nom : null;
      h += '<div class="comp"><div class="lbl">'+esc(c.lbl)+'</div><div class="levels">'
        + NIVEAUX.map(function(n){
            return '<button class="lv lv'+n.n+'" aria-pressed="'+(!!rec && rec.niveau===n.n)+'" data-cc="'+c.id+'" data-n="'+n.n+'" title="'+n.long+'">'+n.court+'</button>';
          }).join("")
        + '</div><div class="lv-legend">'
        + (rec ? "Évalué le "+frDate(rec.date)+(apn ? " — "+esc(apn) : "") : "Pas encore évalué")
        + '</div></div>';
    });
    h += '</div><div class="sect"><p class="muted" style="font-size:12px;margin:0">'
      + 'MI maîtrise insuffisante · MF fragile · MS satisfaisante · TBM très bonne maîtrise. '
      + 'Touche à nouveau le même niveau pour l\'effacer.</p></div>';
  }

  app.innerHTML = h;
  on("#back", function(){ go(view.from || {n:"eleves"}); });
  each("[data-o]", function(b){ b.onclick = function(){ ongletFiche = b.dataset.o; render(); }; });
  on("#edite", function(){ sheetEleve(e.id); });
  on("#sanc", function(){ poserSanction(e.id); });
  on("#addrem", function(){ sheetRemarque(e.id, AUJ()); });
  on("#addpos", function(){ sheetRemarque(e.id, AUJ(), "positif"); });
  on("#addoub", function(){ bascule(e.id, "oubli", AUJ()); });
  on("#addnote", function(){ sheetNote(e.id, apsaEnCours(e.classeId, AUJ())); });
  on("#adddisp", function(){ sheetDispense(e.id, null); });
  brancherDispenses();
  each("[data-del]", function(b){
    b.onclick = function(){
      S.events = S.events.filter(function(x){ return x.id !== b.dataset.del; });
      save(); render(); toast("Supprimé");
    };
  });
  each("[data-deln]", function(b){
    b.onclick = function(){
      S.notes = S.notes.filter(function(x){ return x.id !== b.dataset.deln; });
      save(); render(); toast("Note supprimée");
    };
  });
  each("[data-cc]", function(b){
    b.onclick = function(){ noterCompetence(e, b.dataset.cc, +b.dataset.n, apsaEnCours(e.classeId, AUJ())); render(); };
  });
}

function noterCompetence(e, compId, niveau, ap){
  var i = -1;
  S.comps.forEach(function(x,k){ if(x.eleveId===e.id && x.compId===compId) i = k; });
  if(i >= 0 && S.comps[i].niveau === niveau) S.comps.splice(i,1);
  else if(i >= 0){ S.comps[i].niveau = niveau; S.comps[i].date = AUJ(); S.comps[i].apsaId = ap ? ap.id : null; }
  else S.comps.push({id:uid(), eleveId:e.id, compId:compId, niveau:niveau, date:AUJ(), apsaId:ap?ap.id:null});
  save();
}

     localStorage, qui n'y est pas) et on recharge depuis le réseau. */
  on("#maj", function(){
    toast("Recherche d'une mise à jour…");
    var etapes = [];
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      etapes.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.update(); }));
      }));
    }
    if(window.caches && caches.keys){
      etapes.push(caches.keys().then(function(ns){
        return Promise.all(ns.map(function(n){ return caches.delete(n); }));
      }));
    }
    Promise.all(etapes)["catch"](function(){})
      .then(function(){ location.reload(); });
  });

  var si = app.querySelector("#seuil");
  si.onchange = function(){
    var v = Math.max(1, Math.min(10, parseInt(si.value,10) || 3));

  app.querySelector("#file").onchange = function(ev){

  };
  on("#demo", function(){

/* ══════════ Sauvegarde : export et import ══════════
   Sert notamment à déménager l'appli vers une autre adresse : le stockage
   du navigateur est propre à un domaine, il ne suit pas le déménagement.
   CLES_STOCKAGE est dérivé de KEY, jamais recopié à la main : si une clé
   est ajoutée un jour, il suffit de l'ajouter ici. */
var VERSION_SAUVEGARDE = 1;
var CLES_STOCKAGE = [KEY, KEY_ETAPES, KEY_TIRAGE, KEY_UNSS];

function nomFichierSauvegarde(){
  return "carnet-eps-sauvegarde-" + AUJ() + ".json";
}
/* On stocke la valeur brute de chaque clé, telle qu'elle est enregistrée :
   la forme des objets n'est ni relue ni transformée. */
function collecterSauvegarde(){
  var donnees = {}, n = 0;
  CLES_STOCKAGE.forEach(function(k){
    var v = null;
    try { v = localStorage.getItem(k); } catch(e){ v = null; }
    if(v !== null){ donnees[k] = v; n++; }
  });
  return {
    format: "carnet-eps-sauvegarde",
    versionSauvegarde: VERSION_SAUVEGARDE,
    exporteLe: AUJ(),
    cles: CLES_STOCKAGE.slice(),
    nbCles: n,
    donnees: donnees
  };
}
/* Trois voies, de la plus fiable à la plus rudimentaire : l'artefact Claude,
   le téléchargement classique (celui qui marchera sur la nouvelle adresse),
   puis le presse-papier si le navigateur bloque tout. */
function telechargerFichier(nom, texte){
  try {
    var blob = new Blob([texte], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch(e){ return false; }
}

function exporter(){
  var paquet = collecterSauvegarde();
  if(!paquet.nbCles) return toast("Rien à sauvegarder pour l'instant");
  var data = JSON.stringify(paquet, null, 2);
  var nom = nomFichierSauvegarde();
  var use = window.claude && window.claude.use ? window.claude.use("downloads") : null;
  Promise.resolve(use).then(function(dl){
    if(dl && dl.save){
      return dl.save({filename:nom, data:data}).then(function(){ toast("Sauvegarde enregistrée : " + nom); });
    }
    if(telechargerFichier(nom, data)){ toast("Sauvegarde téléchargée : " + nom); return; }
    return navigator.clipboard.writeText(data).then(function(){ toast("Sauvegarde copiée dans le presse-papier"); });
  }).catch(function(){
    if(telechargerFichier(nom, data)) toast("Sauvegarde téléchargée : " + nom);
    else toast("Export refusé ou indisponible sur cet appareil");
  });
}

/* Retourne le paquet si le fichier est une sauvegarde exploitable,
   sinon une chaîne expliquant précisément ce qui ne va pas. */
function verifierSauvegarde(texte){
  var d;
  try { d = JSON.parse(texte); }
  catch(e){ return "Fichier illisible : ce n'est pas du JSON"; }
  if(!d || typeof d !== "object" || d instanceof Array) return "Fichier illisible : contenu inattendu";

  /* Ancien export : le contenu de l'appli était écrit directement, sans
     enveloppe. On l'accepte pour ne pas perdre une sauvegarde déjà faite. */
  if(d.classes && d.classes instanceof Array && !d.donnees){
    var ancien = {};
    ancien[KEY] = JSON.stringify(d);
    return {format:"carnet-eps-sauvegarde", versionSauvegarde:0,
            cles:[KEY], nbCles:1, donnees:ancien, ancienFormat:true};
  }

  if(d.format !== "carnet-eps-sauvegarde") return "Ce fichier n'est pas une sauvegarde du Carnet EPS";
  if(typeof d.versionSauvegarde !== "number") return "Sauvegarde sans numéro de version : fichier abîmé";
  if(d.versionSauvegarde > VERSION_SAUVEGARDE){
    return "Sauvegarde version " + d.versionSauvegarde + ", trop récente pour cette appli";
  }
  if(!d.donnees || typeof d.donnees !== "object") return "Sauvegarde vide : aucune donnée à l'intérieur";
  if(typeof d.donnees[KEY] !== "string") return "Sauvegarde incomplète : les données de l'appli manquent";
  try { JSON.parse(d.donnees[KEY]); }
  catch(e){ return "Sauvegarde abîmée : les données sont illisibles"; }
  return d;
}

function appliquerSauvegarde(paquet){
  var ecrites = 0;
  try {
    Object.keys(paquet.donnees).forEach(function(k){
      if(typeof paquet.donnees[k] !== "string") return;
      localStorage.setItem(k, paquet.donnees[k]);
      ecrites++;
    });
  } catch(e){
    toast("Stockage plein : import interrompu");
    return false;
  }
  if(!ecrites){ toast("Aucune donnée n'a pu être écrite"); return false; }
  return true;
}

function importerSauvegarde(fichier){
  var r = new FileReader();
  r.onerror = function(){ toast("Impossible de lire ce fichier"); };
  r.onload = function(){
    var res = verifierSauvegarde(r.result);
    if(typeof res === "string") return toast(res);
    confirmerImport(res);
  };
  r.readAsText(fichier);
}

function confirmerImport(res){
  {
    var resume = "";
    try {
      var etat = JSON.parse(res.donnees[KEY]);
      resume = (etat.eleves ? etat.eleves.length : 0) + " élèves, "
        + (etat.events ? etat.events.length : 0) + " événements, "
        + (etat.notes ? etat.notes.length : 0) + " notes, "
        + (etat.rappels ? etat.rappels.length : 0) + " rappels";
    } catch(e){ resume = "contenu non détaillé"; }

    ouvrirSheet("Importer cette sauvegarde ?",
      '<p class="muted" style="margin:0">Ça remplacera toutes les données de cet appareil. Continuer ?</p>'
      + '<div class="card" style="padding:12px"><p class="muted" style="margin:0;font-size:13px">'
      + 'Sauvegarde du ' + esc(res.exporteLe ? frDate(res.exporteLe) : "date inconnue")
      + (res.ancienFormat ? ' (ancien format)' : '') + '<br>'
      + esc(resume) + '</p></div>'
      + '<button class="btn wide primary" id="ok">Remplacer mes données</button>'
      + '<button class="btn wide ghost" id="no">Annuler</button>',
      function(root){
        root.querySelector("#no").onclick = fermerSheet;
        root.querySelector("#ok").onclick = function(){
          if(!appliquerSauvegarde(res)) return;
          fermerSheet();
          toast("Sauvegarde importée");
          /* On recharge la page : l'état est relu depuis le stockage et les
             migrations de version se rejouent si la sauvegarde est ancienne. */
          try { location.reload(); }
          catch(e){
            try { S = JSON.parse(localStorage.getItem(KEY)); } catch(err){}
            go({n:"jour", date:AUJ()});
          }
        };
      });
  }
}

/* ── Transfert par texte ──
   Sur certaines tablettes, le téléchargement d'un fichier est bloqué : la
   sauvegarde ne sort alors que par copier-coller. Ces deux fonctions sont la
   voie de secours, et souvent la seule qui marche. */
function texteSauvegarde(){
  return JSON.stringify(collecterSauvegarde(), null, 2);
}

function sheetTexteSauvegarde(){
  var paquet = collecterSauvegarde();
  if(!paquet.nbCles) return toast("Rien à sauvegarder pour l'instant");
  var data = JSON.stringify(paquet, null, 2);
  ouvrirSheet("Sauvegarde en texte",
    '<p class="muted" style="margin:0;font-size:13px">Copie tout ce cadre, puis colle-le dans l\'autre appli : Réglages → Coller une sauvegarde. Aucun fichier n\'est nécessaire.</p>'
    + '<textarea id="tx" readonly style="min-height:190px;font-size:11px;font-family:monospace">'+esc(data)+'</textarea>'
    + '<button class="btn primary wide" id="copier">Tout copier</button>'
    + '<p class="muted" style="margin:0;font-size:12px">Si le bouton ne fait rien : appui long dans le cadre, puis « Tout sélectionner » et « Copier ».</p>',
    function(root){
      var t = root.querySelector("#tx");
      root.querySelector("#copier").onclick = function(){
        try { t.focus(); t.setSelectionRange(0, t.value.length); } catch(e){}
        var fait = false;
        try { fait = document.execCommand("copy"); } catch(e){ fait = false; }
        if(fait) return toast("Sauvegarde copiée (" + Math.round(data.length/1024) + " Ko)");
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(data).then(function(){
            toast("Sauvegarde copiée (" + Math.round(data.length/1024) + " Ko)");
          }).catch(function(){
            toast("Copie refusée — appui long puis « Tout sélectionner »");
          });
          return;
        }
        toast("Copie refusée — appui long puis « Tout sélectionner »");
      };
    });
}

function sheetCollerSauvegarde(){
  ouvrirSheet("Coller une sauvegarde",
    '<p class="muted" style="margin:0;font-size:13px">Colle ici le texte copié depuis l\'autre appli. Il commence par une accolade et contient « carnet-eps-sauvegarde ».</p>'
    + '<label class="field"><span>Texte de la sauvegarde</span>'
    + '<textarea id="tx" style="min-height:170px;font-size:12px" placeholder="{ &quot;format&quot;: &quot;carnet-eps-sauvegarde&quot;, …"></textarea></label>'
    + '<button class="btn primary wide" id="ok">Vérifier et importer</button>',
    function(root){
      root.querySelector("#ok").onclick = function(){
        var txt = root.querySelector("#tx").value.trim();
        if(!txt) return toast("Colle d'abord le texte");
        var res = verifierSauvegarde(txt);
        if(typeof res === "string") return toast(res);
        fermerSheet();
        confirmerImport(res);
      };
    });
}

/* ══════════ Feuilles de saisie ══════════ */
function ouvrirSheet(titre, html, init){
  fermerSheet();
  var s = document.createElement("div");
  s.className = "scrim"; s.setAttribute("role","dialog"); s.setAttribute("aria-modal","true");
  s.innerHTML = '<div class="sheet"><div class="row" style="margin-bottom:14px">'
    + '<h3 class="grow">'+titre+'</h3><button class="backbtn" id="x" aria-label="Fermer">✕</button></div>'
    + '<div class="stack" id="c"></div></div>';
  document.body.appendChild(s);
  sheet = s;
  s.onclick = function(ev){ if(ev.target === s) fermerSheet(); };
  s.querySelector("#x").onclick = fermerSheet;
  var c = s.querySelector("#c");
  c.innerHTML = html;
  if(init) init(c);
  var f = c.querySelector("input,textarea,select");
  if(f) setTimeout(function(){ f.focus(); }, 80);
}

    function(root){
      root.querySelector("#ok").onclick = function(){

        if(c){ c.nom = nm; c.noter = nt; }

        save(); fermerSheet(); render(); toast("Classe enregistrée");

      var d = root.querySelector("#del");
      if(d) d.onclick = function(){
        if(estGroupe(c)){
          /* Un groupe ne possède pas ses élèves : on ne retire que le groupe. */
          S.apsa = S.apsa.filter(function(x){ return x.classeId !== c.id; });
          S.classes = S.classes.filter(function(x){ return x.id !== c.id; });
          save(); fermerSheet(); go({n:"classes"}); toast("Groupe supprimé, élèves conservés");
          return;
        }
        var ids = S.eleves.filter(function(e){ return e.classeId===c.id; }).map(function(e){ return e.id; });
        S.eleves = S.eleves.filter(function(e){ return e.classeId !== c.id; });
        S.events = S.events.filter(function(x){ return ids.indexOf(x.eleveId) < 0; });
        S.notes  = S.notes.filter(function(x){ return ids.indexOf(x.eleveId) < 0; });
        S.comps  = S.comps.filter(function(x){ return ids.indexOf(x.eleveId) < 0; });
        S.apsa   = S.apsa.filter(function(x){ return x.classeId !== c.id; });
        S.classes = S.classes.filter(function(x){ return x.id !== c.id; });
        save(); fermerSheet(); go({n:"classes"}); toast("Classe supprimée");
      };
    });
}

          : '')

      + (dp ? '<span class="badge b-accent">dispensé</span>' : '')

  });

  var classes = els.map(function(e){

  }).filter(function(x){ return x.v != null; })
    .sort(function(a,b){ return ep.sens === "min" ? a.v - b.v : b.v - a.v; });

  h += '<div class="sect"'+sty+'><span class="eyebrow">Classement ('+classes.length+')</span>';
  if(!classes.length){
    h += '<div class="empty">Saisis les essais : le classement se remplit tout seul.</div></div>';
  } else {
    h += '<div class="plist">' + classes.map(function(x, i){
      return '<div class="prow"><span class="rang'+(i < 3 ? " podium" : "")+'">'+(i+1)+'</span>'
        + '<span class="grow truncate"><span class="nm">'+esc(x.e.nom.toUpperCase())+' '+esc(x.e.prenom)+'</span></span>'
        + '<span class="num" style="font-weight:600">'+nombreFr(x.v)+' '+ep.unite+'</span></div>';
    }).join("") + '</div></div>';

      go({n:"atelier", classeId:cl.id, date:date, epreuveId:b.dataset.ep, from:view.from});
    };
  });
  /* On n'appelle pas render() à la frappe : le clavier resterait ouvert
     mais le champ perdrait le focus. On met à jour le meilleur essai à la main. */
  each("[data-i]", function(inp){
    inp.onchange = function(){
      var eid = inp.dataset.e, i = +inp.dataset.i;
      var v = litNombre(inp.value);
      inp.value = nombreFr(v);
      enregistrerEssai(eid, ep, date, ap ? ap.id : null, i, v);
      var p = perfDe(eid, ep.id);

        cell.className = "best" + (b == null ? " vide" : "");
      }
    };
  });

/* ══════════ Routeur ══════════ */

/* ══════════ UNSS Football ══════════
   Les équipes n'ont pas de nom : leur couleur de chasuble EST leur nom. Tout
   l'affichage repose donc sur la pastille de couleur, jamais sur du texte seul. */

var MAILLOTS = [
  {id:"rouge",  nom:"Rouge",  fond:"#E23B2E", texte:"#FFFFFF"},
  {id:"bleu",   nom:"Bleu",   fond:"#1D6FD0", texte:"#FFFFFF"},
  {id:"jaune",  nom:"Jaune",  fond:"#F2C314", texte:"#1A1A1A"},
  {id:"vert",   nom:"Vert",   fond:"#1F9D55", texte:"#FFFFFF"},
  {id:"orange", nom:"Orange", fond:"#F07316", texte:"#FFFFFF"},
  {id:"violet", nom:"Violet", fond:"#7A3FD1", texte:"#FFFFFF"},
  {id:"rose",   nom:"Rose",   fond:"#E8559A", texte:"#FFFFFF"},
  {id:"cyan",   nom:"Cyan",   fond:"#17B3C4", texte:"#1A1A1A"},
  {id:"noir",   nom:"Noir",   fond:"#242424", texte:"#FFFFFF"},
  {id:"blanc",  nom:"Blanc",  fond:"#FFFFFF", texte:"#1A1A1A"},
  {id:"gris",   nom:"Gris",   fond:"#8A8F98", texte:"#FFFFFF"},
  {id:"marron", nom:"Marron", fond:"#7B4B2A", texte:"#FFFFFF"}
];
function maillot(id){
  return MAILLOTS.filter(function(m){ return m.id === id; })[0] || MAILLOTS[0];
}
function pastille(m, taille){
  return '<span class="past" style="width:'+taille+'px;height:'+taille+'px;background:'+m.fond+'"></span>';
}
function pastilleEq(t, eqId, taille){
  var e = equipeDe(t, eqId);
  if(!e) return '<span class="past" style="width:'+taille+'px;height:'+taille+'px;background:var(--line)"></span>';
  return pastille(maillot(e.couleur), taille);
}
function nomEq(t, eqId){
  var e = equipeDe(t, eqId);
  return e ? maillot(e.couleur).nom : "—";
}
function equipeDe(t, eqId){
  return (t.equipes || []).filter(function(e){ return e.id === eqId; })[0] || null;
}

/* ── Stockage : clé dédiée, versionnée, incluse dans l'export ── */
function lireUnss(){
  var o = null;
  try { o = JSON.parse(localStorage.getItem(KEY_UNSS)); } catch(e){ o = null; }
  if(!o || typeof o !== "object" || o.version !== VERSION_UNSS) o = {version:VERSION_UNSS, tournois:[]};
  if(Object.prototype.toString.call(o.tournois) !== "[object Array]") o.tournois = [];
  return o;
}
function ecrireUnss(u){
  try { localStorage.setItem(KEY_UNSS, JSON.stringify(u)); return true; }
  catch(e){ toast("Stockage plein : rien n'a été enregistré"); return false; }
}
function tournoiById(id){
  return lireUnss().tournois.filter(function(t){ return t.id === id; })[0] || null;
}
function sauverTournoi(t){
  var u = lireUnss(), i = -1;
  u.tournois.forEach(function(x, k){ if(x.id === t.id) i = k; });
  if(i < 0) u.tournois.unshift(t); else u.tournois[i] = t;
  return ecrireUnss(u);
}

/* ── Fabrication du calendrier ── */

/* Répartition en serpentin : les poules restent de tailles voisines. */
function repartirPoules(equipes, nb){
  var p = [], i;
  for(i = 0; i < nb; i++) p.push([]);
  equipes.forEach(function(e, k){ p[k % nb].push(e.id); });
  return p;
}

/* Méthode du cercle : à chaque tour, toute équipe joue une fois et une seule.
   C'est ce qui garantit l'équilibre avant même le réordonnancement. */
function rondes(ids){
  var l = ids.slice();
  if(l.length < 2) return [];
  if(l.length % 2) l.push(null);          /* équipe fictive : celle qui repose */
  var n = l.length, tours = [], t, i;
  for(t = 0; t < n - 1; t++){
    var tour = [];
    for(i = 0; i < n / 2; i++){
      var a = l[i], b = l[n - 1 - i];
      /* On alterne le sens pour ne pas toujours désigner le même « recevant ». */
      if(a && b) tour.push(t % 2 ? {a:b, b:a} : {a:a, b:b});
    }
    tours.push(tour);
    l.splice(1, 0, l.pop());              /* la première reste fixe, le reste tourne */
  }
  return tours;
}

function joue(m, id){ return !!id && (m.a === id || m.b === id); }

/* Aucune équipe ne doit enchaîner deux matchs. On avance dans la file et, dès
   qu'une rencontre ferait rejouer une équipe du match précédent, on va chercher
   plus loin la première qui ne pose pas ce problème. Si aucune ne convient, on
   laisse tel quel : mieux vaut un enchaînement qu'un calendrier bancal. */
function espacer(file){
  for(var i = 1; i < file.length; i++){
    var p = file[i - 1];
    if(!joue(file[i], p.a) && !joue(file[i], p.b)) continue;
    for(var j = i + 1; j < file.length; j++){
      if(joue(file[j], p.a) || joue(file[j], p.b)) continue;
      var m = file.splice(j, 1)[0];
      file.splice(i, 0, m);
      break;
    }
  }
  return file;
}

/* On alterne les poules tour par tour : deux poules donnent A, B, A, B… */
function ordonnerMatchs(toursParPoule){
  var file = [], maxT = 0;
  toursParPoule.forEach(function(tours){ if(tours.length > maxT) maxT = tours.length; });
  for(var t = 0; t < maxT; t++){
    toursParPoule.forEach(function(tours, p){
      (tours[t] || []).forEach(function(m){ file.push({a:m.a, b:m.b, poule:p, tour:t}); });
    });
  }
  return espacer(file);
}

/* Un arbitre par match : jamais une des deux équipes en jeu, et si possible
   aucune de celles qui jouent juste avant ou juste après — sinon elles courent
   du terrain au sifflet sans souffler. À contrainte égale, on prend celle qui a
   le moins arbitré, pour répartir la charge. */
function attribuerArbitres(file, ids){
  var compte = {};
  ids.forEach(function(id){ compte[id] = 0; });
  file.forEach(function(m, i){
    var prec = file[i - 1], suiv = file[i + 1];
    function libres(strict){
      return ids.filter(function(id){
        if(joue(m, id)) return false;
        if(!strict) return true;
        if(prec && joue(prec, id)) return false;
        if(suiv && joue(suiv, id)) return false;
        return true;
      });
    }
    var c = libres(true);
    if(!c.length) c = libres(false);
    if(!c.length){ m.arbitre = null; return; }
    c.sort(function(x, y){ return compte[x] - compte[y]; });
    m.arbitre = c[0];
    compte[c[0]]++;
  });
  return file;
}

function genererTournoi(t){
  var poules = repartirPoules(t.equipes, t.config.poules);
  var tours = poules.map(function(p){ return rondes(p); });
  var ids = t.equipes.map(function(e){ return e.id; });
  var file = attribuerArbitres(ordonnerMatchs(tours), ids);
  t.poulesComposition = poules;
  t.matchs = file.map(function(m, i){
    return {id:uid(), phase:"poule", poule:m.poule, tour:m.tour, ordre:i + 1,
            a:m.a, b:m.b, arbitre:m.arbitre, sa:null, sb:null, tab:null};
  });
  return t;
}

/* ── Classement et phase finale ── */
var PHASES = {poule:"Phase de poules", quarts:"Quarts de finale",
              demies:"Demi-finales", finale:"Finale"};
var TAILLES = {quarts:8, demies:4, finale:2};
var SUITE = {quarts:"demies", demies:"finale", finale:null};

function matchJoue(m){ return m.sa != null && m.sb != null; }

function classementPoule(t, p){
  var ids = (t.poulesComposition || [])[p] || [], st = {};
  ids.forEach(function(id){ st[id] = {id:id, j:0, g:0, n:0, pe:0, bp:0, bc:0, pts:0}; });
  t.matchs.forEach(function(m){
    if(m.phase !== "poule" || m.poule !== p || !matchJoue(m)) return;
    var A = st[m.a], B = st[m.b];
    if(!A || !B) return;
    A.j++; B.j++;
    A.bp += m.sa; A.bc += m.sb; B.bp += m.sb; B.bc += m.sa;
    if(m.sa > m.sb){ A.g++; B.pe++; A.pts += 3; }
    else if(m.sa < m.sb){ B.g++; A.pe++; B.pts += 3; }
    else { A.n++; B.n++; A.pts += 1; B.pts += 1; }
  });
  return ids.map(function(id){ return st[id]; }).sort(function(x, y){
    return (y.pts - x.pts) || ((y.bp - y.bc) - (x.bp - x.bc)) || (y.bp - x.bp);
  });
}

function poulesTerminees(t){
  var l = t.matchs.filter(function(m){ return m.phase === "poule"; });
  return l.length > 0 && l.filter(matchJoue).length === l.length;
}

/* Qualifiés : d'abord tous les premiers de poule, puis tous les deuxièmes, et
   à l'intérieur d'un même rang on départage aux points. */
function qualifies(t, n){
  var tous = [];
  (t.poulesComposition || []).forEach(function(_, p){
    classementPoule(t, p).forEach(function(l, rang){ tous.push({rang:rang, l:l}); });
  });
  tous.sort(function(x, y){
    return (x.rang - y.rang) || (y.l.pts - x.l.pts)
      || ((y.l.bp - y.l.bc) - (x.l.bp - x.l.bc)) || (y.l.bp - x.l.bp);
  });
  return tous.slice(0, n).map(function(x){ return x.l.id; });
}

function vainqueur(m){
  if(!matchJoue(m)) return null;
  if(m.sa > m.sb) return m.a;
  if(m.sb > m.sa) return m.b;
  return m.tab === "a" ? m.a : (m.tab === "b" ? m.b : null);
}

/* Tête de série contre dernier qualifié : 1-8, 2-7, 3-6, 4-5. */
function apparier(ids){
  var p = [], n = ids.length, i;
  for(i = 0; i < n / 2; i++) p.push({a:ids[i], b:ids[n - 1 - i]});
  return p;
}

function ajouterTour(t, phase, ids){
  var paires = apparier(ids);
  attribuerArbitres(paires, t.equipes.map(function(e){ return e.id; }));
  var ordre = t.matchs.length;
  paires.forEach(function(m){
    t.matchs.push({id:uid(), phase:phase, poule:null, tour:0, ordre:++ordre,
                   a:m.a, b:m.b, arbitre:m.arbitre, sa:null, sb:null, tab:null});
  });
  return t;
}

function matchsDe(t, phase){
  return t.matchs.filter(function(m){ return m.phase === phase; });
}

/* Quelle est la prochaine étape possible ? Renvoie null s'il n'y a rien à
   lancer : soit les poules ne sont pas finies, soit le tournoi est terminé. */
function prochaineEtape(t){
  var fin = t.config.finale;
  if(!fin || fin === "aucune") return null;
  if(!matchsDe(t, fin).length){
    if(!poulesTerminees(t)) return null;
    return {phase:fin, ids:qualifies(t, Math.min(TAILLES[fin], t.equipes.length))};
  }
  var phase = fin;
  while(phase){
    var l = matchsDe(t, phase);
    if(!l.length) return null;
    var v = l.map(vainqueur);
    if(v.filter(function(x){ return !!x; }).length !== l.length) return null;
    var suite = SUITE[phase];
    if(!suite) return null;
    if(!matchsDe(t, suite).length) return {phase:suite, ids:v};
    phase = suite;
  }
  return null;
}

function tournoiFini(t){
  var f = matchsDe(t, "finale");
  if(f.length) return !!vainqueur(f[0]);
  return t.matchs.length > 0 && t.matchs.filter(matchJoue).length === t.matchs.length;
}
function championDe(t){
  var f = matchsDe(t, "finale");
  if(f.length) return vainqueur(f[0]);
  if(!poulesTerminees(t)) return null;
  var q = qualifies(t, 1);
  return q.length ? q[0] : null;
}
/* Prochain match à jouer, dans l'ordre du calendrier. */
function matchCourant(t){
  return t.matchs.filter(function(m){ return !matchJoue(m); })[0] || null;
}

/* ── La roue des couleurs ──
   Couche fixe par-dessus l'appli, comme le minuteur plein écran : pas de
   requestFullscreen, capricieux sur tablette. Le tirage est fait AVANT
   l'animation, puis la roue est tournée pour s'arrêter dessus : ce qui
   s'affiche est donc exactement ce qui a été tiré. */
var roue = null;

function secteur(cx, cy, r, a0, a1){
  var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  var grand = (a1 - a0) > Math.PI ? 1 : 0;
  return "M" + cx + " " + cy
    + " L" + x0.toFixed(2) + " " + y0.toFixed(2)
    + " A" + r + " " + r + " 0 " + grand + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) + " Z";
}

function fermerRoue(){
  var d = document.getElementById("roue");
  if(d) d.remove();
  roue = null;
  rendreVeille();
}

function ouvrirRoue(couleurs, titre){
  fermerRoue();
  if(!couleurs.length) return toast("Aucune couleur à tirer");
  var n = couleurs.length, pas = 360 / n, r = 140;
  var segs = couleurs.map(function(m, i){
    var a0 = (-90 + i * pas) * Math.PI / 180;
    var a1 = (-90 + (i + 1) * pas) * Math.PI / 180;
    return n === 1
      ? '<circle cx="150" cy="150" r="'+r+'" fill="'+m.fond+'"></circle>'
      : '<path d="'+secteur(150, 150, r, a0, a1)+'" fill="'+m.fond+'" stroke="#FFFFFF" stroke-width="2"></path>';
  }).join("");

  var d = document.createElement("div");
  d.className = "roue"; d.id = "roue";
  d.innerHTML = '<button class="roue-x" id="roue-x" aria-label="Fermer">✕</button>'
    + '<div class="roue-titre">'+esc(titre)+'</div>'
    + '<svg class="roue-svg" viewBox="0 0 300 300" aria-hidden="true">'
    + '<g id="roue-g">'+segs+'</g>'
    + '<circle cx="150" cy="150" r="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"></circle>'
    + '<polygon points="150,2 137,36 163,36" fill="#1A1A1A"></polygon></svg>'
    + '<div class="roue-res" id="roue-res"><span class="muted" style="font-size:22px">Prêt ?</span></div>'
    + '<button class="btn primary roue-btn" id="roue-go">Lancer la roue</button>';
  document.body.appendChild(d);
  roue = {angle:0, tourne:false};

  var g = d.querySelector("#roue-g"), res = d.querySelector("#roue-res");
  d.querySelector("#roue-x").onclick = fermerRoue;
  d.querySelector("#roue-go").onclick = function(){
    if(roue.tourne) return;
    roue.tourne = true;
    res.innerHTML = '<span class="muted" style="font-size:22px">…</span>';
    var i = Math.floor(Math.random() * n);
    /* Angle qui amène le centre du secteur i sous la flèche du haut. */
    var cible = ((-(i + 0.5) * pas) % 360 + 360) % 360;
    roue.angle = roue.angle - (roue.angle % 360) + 360 * 6 + cible;
    g.style.transition = "transform 3.2s cubic-bezier(.16,.86,.22,1)";
    g.style.transform = "rotate(" + roue.angle + "deg)";
    setTimeout(function(){
      if(!roue) return;
      roue.tourne = false;
      var m = couleurs[i];
      res.innerHTML = pastille(m, 64) + '<span>' + esc(m.nom) + '</span>';
    }, 3300);
  };
  prendreVeille();
}

/* Créer un tournoi doit tenir en un geste : on touche le nombre d'équipes et
   c'est parti. Une poule unique, aucune phase finale, quatre minutes par match.
   Les réglages restent accessibles, repliés, pour les fois où ça ne suffit pas. */
var DEFAUTS_TOURNOI = {poules:1, finale:"aucune", duree:4};

function sheetNouveauTournoi(){
  var n = lireUnss().tournois.length + 1;
  var grille = "";
  for(var i = 3; i <= 12; i++){
    grille += '<button class="btn nb" data-n="'+i+'">'+i+'</button>';
  }
  ouvrirSheet("Combien d'équipes ?",
    '<div class="nbgrille">' + grille + '</div>'
    + '<p class="muted" style="font-size:13px;margin:0">Une poule, tout le monde se rencontre, '
    + 'matchs de 4 minutes. Les couleurs sont attribuées toutes seules.</p>'
    + '<button class="btn wide ghost" id="plus">Réglages…</button>'
    + '<div id="opts" style="display:none">'
    + '<label class="field"><span>Poules</span><select id="np">'
    + '<option value="1" selected>1 poule (tout le monde se rencontre)</option>'
    + '<option value="2">2 poules</option><option value="3">3 poules</option>'
    + '<option value="4">4 poules</option></select></label>'
    + '<label class="field"><span>Phase finale</span><select id="pf">'
    + '<option value="aucune" selected>Aucune — classement seul</option>'
    + '<option value="finale">Finale (les 2 premiers)</option>'
    + '<option value="demies">Demi-finales (les 4 premiers)</option>'
    + '<option value="quarts">Quarts de finale (les 8 premiers)</option></select></label>'
    + '<label class="field"><span>Durée d\'un match (minutes)</span>'
    + '<input type="number" id="du" min="1" max="30" value="'+DEFAUTS_TOURNOI.duree+'"></label></div>',
    function(root){
      var opts = root.querySelector("#opts");
      root.querySelector("#plus").onclick = function(){
        var ouvert = opts.style.display !== "none";
        opts.style.display = ouvert ? "none" : "block";
        this.textContent = ouvert ? "Réglages…" : "Masquer les réglages";
      };
      Array.prototype.forEach.call(root.querySelectorAll("[data-n]"), function(b){
        b.onclick = function(){
          var ne = parseInt(b.dataset.n, 10);
          var np = parseInt(root.querySelector("#np").value, 10) || DEFAUTS_TOURNOI.poules;
          var pf = root.querySelector("#pf").value || DEFAUTS_TOURNOI.finale;
          if(np > Math.floor(ne / 2)) return toast("Trop de poules pour " + ne + " équipes");
          if(pf !== "aucune" && TAILLES[pf] > ne){
            return toast(PHASES[pf] + " : il faut au moins " + TAILLES[pf] + " équipes");
          }
          var t = {
            id:uid(),
            nom:"Tournoi " + n,
            date:AUJ(),
            config:{poules:np, finale:pf,
                    duree:Math.max(1, Math.min(30,
                      parseInt(root.querySelector("#du").value, 10) || DEFAUTS_TOURNOI.duree))},
            equipes:MAILLOTS.slice(0, ne).map(function(m){ return {id:uid(), couleur:m.id}; }),
            matchs:[]
          };
          genererTournoi(t);
          if(!sauverTournoi(t)) return;
          fermerSheet();
          go({n:"tournoi", id:t.id});
          toast(t.matchs.length + " matchs · " + t.config.duree + " min");
        };
      });
    });
}

/* La durée reste modifiable une fois le tournoi lancé : on ne devine pas
   toujours juste avant d'avoir vu jouer la première rencontre. */
function sheetDuree(tid){
  var t = tournoiById(tid);
  if(!t) return;
  var choix = [3, 4, 5, 6, 8, 10, 12, 15];
  ouvrirSheet("Durée d'un match",
    '<div class="nbgrille">'
    + choix.map(function(m){
        return '<button class="btn nb' + (m === t.config.duree ? ' sel' : '') + '" data-d="'+m+'">'+m+'</button>';
      }).join("")
    + '</div>'
    + '<label class="field"><span>Autre durée (minutes)</span>'
    + '<input type="number" id="du" min="1" max="45" value="'+t.config.duree+'"></label>'
    + '<button class="btn primary wide" id="ok">Enregistrer</button>',
    function(root){
      function poser(v){
        t.config.duree = Math.max(1, Math.min(45, v));
        sauverTournoi(t); fermerSheet(); render();
        toast("Matchs de " + t.config.duree + " min");
      }
      Array.prototype.forEach.call(root.querySelectorAll("[data-d]"), function(b){
        b.onclick = function(){ poser(parseInt(b.dataset.d, 10)); };
      });
      root.querySelector("#ok").onclick = function(){
        poser(parseInt(root.querySelector("#du").value, 10) || t.config.duree);
      };
    });
}

/* ── Écran : un tournoi ── */
function vueTournoi(){
  var t = tournoiById(view.id);
  if(!t) return go({n:"unss"});
  var courant = matchCourant(t);
  var etape = prochaineEtape(t);
  var ch = tournoiFini(t) ? championDe(t) : null;

  var h = header(t.nom, frDate(t.date) + " · " + t.equipes.length + " équipes", true);

  if(ch){
    var mc = maillot(equipeDe(t, ch).couleur);
    h += '<div class="sect"><div class="foot" style="cursor:default">'
      + '<span class="bal">🏆</span><span class="grow"><span class="t">Vainqueur : '+esc(mc.nom)+'</span>'
      + '<span class="s">Tournoi terminé</span></span>'+pastille(mc, 34)+'</div></div>';
  } else if(courant){
    h += '<div class="sect"><span class="eyebrow">Match en cours</span>'
      + '<div class="foot" style="cursor:default"><span class="grow">'
      + '<span class="s">'+esc(PHASES[courant.phase])
      + (courant.phase === "poule" ? " · poule " + String.fromCharCode(65 + courant.poule) : "")
      + ' · match '+courant.ordre+'</span>'
      + '<span class="t" style="display:flex;align-items:center;gap:10px;margin-top:6px">'
      + pastilleEq(t, courant.a, 30) + esc(nomEq(t, courant.a))
      + ' <span style="opacity:.7;font-size:14px">contre</span> '
      + pastilleEq(t, courant.b, 30) + esc(nomEq(t, courant.b)) + '</span>'
      + '<span class="s" style="margin-top:8px">Arbitre : '
      + (courant.arbitre ? esc(nomEq(t, courant.arbitre)) : "à désigner") + '</span>'
      + '</span></div></div>';
  }

  h += '<div class="sect"><div class="row">'
    + '<button class="btn grow primary" id="roue">Roue des couleurs</button>'
    + (courant ? '<button class="btn grow" id="chrono">Chrono '+t.config.duree+' min</button>' : '')
    + '</div><div class="row" style="margin-top:8px">'
    + '<button class="btn grow" id="clst">Classement</button>'
    + '<button class="btn grow" id="duree">Durée : '+t.config.duree+' min</button>'
    + '</div></div>';

  /* Les matchs, groupés par phase, dans l'ordre de passage. */
  var phases = [];
  t.matchs.forEach(function(m){ if(phases.indexOf(m.phase) < 0) phases.push(m.phase); });
  h += '<div class="sect">';
  phases.forEach(function(ph){
    h += '<span class="mphase">'+esc(PHASES[ph] || ph)+'</span>';
    t.matchs.filter(function(m){ return m.phase === ph; }).forEach(function(m){
      var fini = matchJoue(m);
      var enc = courant && m.id === courant.id;
      h += '<button class="mrow'+(enc?" encours":"")+(fini?" finie":"")+'" data-m="'+m.id+'">'
        + '<span class="mno">'+m.ordre+'</span>'
        + pastilleEq(t, m.a, 26)
        + '<span class="msc">'+(fini ? m.sa + " – " + m.sb : "–")+'</span>'
        + pastilleEq(t, m.b, 26)
        + '<span class="grow"></span>'
        + (m.arbitre ? '<span class="marb">arb.'+pastilleEq(t, m.arbitre, 16)+'</span>' : '')
        + '</button>';
    });
  });
  h += '</div>';

  if(etape){
    h += '<div class="sect"><button class="btn wide primary" id="etape">'
      + 'Lancer les ' + esc((PHASES[etape.phase] || "").toLowerCase()) + '</button></div>';
  }

  h += '<div class="sect"><span class="eyebrow">Équipes · touche pour changer la couleur</span>';
  t.equipes.forEach(function(e){
    var m = maillot(e.couleur);
    var arb = t.matchs.filter(function(x){ return x.arbitre === e.id; }).length;
    h += '<button class="eqrow" data-e="'+e.id+'">'+pastille(m, 34)
      + '<span class="grow"><span class="nm">'+esc(m.nom)+'</span><br>'
      + '<span class="meta">arbitre '+arb+' fois</span></span><span class="chev">›</span></button>';
  });
  h += '</div>';

  h += '<div class="sect"><div class="row">'
    + '<button class="btn grow" id="regen">Refaire le calendrier</button>'
    + '<button class="btn grow danger" id="suppr">Supprimer</button></div></div>';

  app.innerHTML = h;
  on("#back", function(){ go({n:"unss"}); });
  on("#roue", function(){
    ouvrirRoue(t.equipes.map(function(e){ return maillot(e.couleur); }), t.nom);
  });
  on("#chrono", function(){
    ouvrirPlein("unss:" + t.id, 0, "Match " + courant.ordre + " · "
      + nomEq(t, courant.a) + " – " + nomEq(t, courant.b), t.config.duree);
    lancerMinuteur("unss:" + t.id, 0, t.config.duree);
    peindrePlein();
  });
  on("#etape", function(){
    ajouterTour(t, etape.phase, etape.ids);
    sauverTournoi(t); render();
    toast(PHASES[etape.phase] + " : calendrier ajouté");
  });
  on("#regen", function(){
    if(t.matchs.filter(matchJoue).length){
      if(!window.confirm("Tous les scores déjà saisis seront effacés. Continuer ?")) return;
    }
    genererTournoi(t); sauverTournoi(t); render();
    toast("Nouveau calendrier");
  });
  on("#suppr", function(){
    if(!window.confirm("Supprimer « " + t.nom + " » ?")) return;
    var u = lireUnss();
    u.tournois = u.tournois.filter(function(x){ return x.id !== t.id; });
    ecrireUnss(u); go({n:"unss"}); toast("Tournoi supprimé");
  });
  on("#clst", function(){ go({n:"classement", id:t.id}); });
  on("#duree", function(){ sheetDuree(t.id); });
  each("[data-m]", function(b){ b.onclick = function(){ sheetScore(t.id, b.dataset.m); }; });
  each("[data-e]", function(b){ b.onclick = function(){ sheetCouleur(t.id, b.dataset.e); }; });
}

/* ── Écran : le classement ──
   Sorti de la page du tournoi, qui devenait trop longue à faire défiler entre
   deux matchs. Ici il tient d'un coup d'œil. */
function vueClassement(){
  var t = tournoiById(view.id);
  if(!t) return go({n:"unss"});
  var joues = t.matchs.filter(matchJoue).length;

  var h = header("Classement", t.nom + " · " + joues + "/" + t.matchs.length + " matchs", true);

  var vide = true;
  (t.poulesComposition || []).forEach(function(_, p){
    var cl = classementPoule(t, p);
    if(!cl.length) return;
    vide = false;
    var nq = t.config.finale !== "aucune"
      ? Math.ceil(Math.min(TAILLES[t.config.finale] || 0, t.equipes.length) / t.config.poules) : 0;
    h += '<div class="sect">'
      + ((t.poulesComposition.length > 1)
          ? '<span class="eyebrow">Poule ' + String.fromCharCode(65 + p) + '</span>' : '')
      + '<table class="clst">'
      + '<tr><th></th><th>Équipe</th><th class="n">J</th><th class="n">G</th><th class="n">N</th>'
      + '<th class="n">P</th><th class="n">Diff</th><th class="n">Pts</th></tr>';
    cl.forEach(function(l, i){
      h += '<tr'+(i < nq ? ' class="qual"' : '')+'><td class="n">'+(i+1)+'</td>'
        + '<td><span class="row" style="gap:8px">'+pastilleEq(t, l.id, 22)+esc(nomEq(t, l.id))+'</span></td>'
        + '<td class="n">'+l.j+'</td><td class="n">'+l.g+'</td>'
        + '<td class="n">'+l.n+'</td><td class="n">'+l.pe+'</td>'
        + '<td class="n">'+(l.bp - l.bc > 0 ? "+" : "")+(l.bp - l.bc)+'</td>'
        + '<td class="n"><b>'+l.pts+'</b></td></tr>';
    });
    h += '</table></div>';
  });

  if(vide){
    h += '<div class="sect"><div class="empty">Aucun match joué pour l\'instant.</div></div>';
  } else {
    h += '<div class="sect"><p class="muted" style="font-size:13px;margin:0">'
      + 'Victoire 3 points, nul 1 point. À égalité, c\'est la différence de buts qui départage, '
      + 'puis les buts marqués.'
      + (t.config.finale !== "aucune" ? ' Les lignes vertes sont qualifiées.' : '')
      + '</p></div>';
  }

  app.innerHTML = h;
  on("#back", function(){ go({n:"tournoi", id:t.id}); });
}

function sheetCouleur(tid, eid){
  var t = tournoiById(tid);
  var e = equipeDe(t, eid);
  if(!e) return;
  var pris = t.equipes.map(function(x){ return x.couleur; });
  ouvrirSheet("Couleur de l'équipe",
    '<div class="row" style="flex-wrap:wrap;gap:10px">'
    + MAILLOTS.map(function(m){
        var occupe = pris.indexOf(m.id) >= 0 && m.id !== e.couleur;
        return '<button class="eqrow" data-k="'+m.id+'" style="width:calc(50% - 5px);margin:0'
          + (occupe ? ';opacity:.45' : '') + (m.id === e.couleur ? ';border-color:var(--accent);border-width:2px' : '')
          + '">' + pastille(m, 28) + '<span class="grow"><span class="nm">'+esc(m.nom)+'</span>'
          + (occupe ? '<br><span class="meta">déjà prise</span>' : '') + '</span></button>';
      }).join("")
    + '</div>',
    function(root){
      Array.prototype.forEach.call(root.querySelectorAll("[data-k]"), function(b){
        b.onclick = function(){
          var k = b.dataset.k;
          /* Si la couleur est déjà portée, on échange : deux équipes ne peuvent
             pas jouer en même couleur. */
          var autre = t.equipes.filter(function(x){ return x.couleur === k && x.id !== eid; })[0];
          if(autre) autre.couleur = e.couleur;
          e.couleur = k;
          sauverTournoi(t); fermerSheet(); render();
          toast(autre ? "Couleurs échangées" : "Équipe en " + maillot(k).nom.toLowerCase());
        };
      });
    });
}

function sheetScore(tid, mid){
  var t = tournoiById(tid);
  var m = t.matchs.filter(function(x){ return x.id === mid; })[0];
  if(!m) return;
  var sa = m.sa == null ? 0 : m.sa, sb = m.sb == null ? 0 : m.sb, tab = m.tab;

  function ligne(cote){
    var id = cote === "a" ? m.a : m.b, v = cote === "a" ? sa : sb;
    return '<div class="row" style="gap:10px;align-items:center;margin-bottom:12px">'
      + pastilleEq(t, id, 38)
      + '<span class="grow"><b style="font-family:Archivo;font-size:17px">'+esc(nomEq(t, id))+'</b></span>'
      + '<button class="btn" data-s="'+cote+'" data-d="-1" style="min-width:54px;min-height:54px;font-size:24px" aria-label="Retirer un but">−</button>'
      + '<b class="num" id="sc-'+cote+'" style="font-size:28px;min-width:44px;text-align:center">'+v+'</b>'
      + '<button class="btn" data-s="'+cote+'" data-d="1" style="min-width:54px;min-height:54px;font-size:24px" aria-label="Ajouter un but">+</button></div>';
  }
  function blocTab(){
    if(m.phase === "poule" || sa !== sb) return '';
    return '<div><p class="muted" style="font-size:13px;margin:0 0 8px">'
      + 'Égalité en '+esc((PHASES[m.phase] || "").toLowerCase())+' : qui passe aux tirs au but ?</p>'
      + '<div class="row"><button class="btn grow" data-tab="a"'
      + (tab === "a" ? ' style="border-color:var(--accent);border-width:2px"' : '') + '>'
      + esc(nomEq(t, m.a))+'</button>'
      + '<button class="btn grow" data-tab="b"'
      + (tab === "b" ? ' style="border-color:var(--accent);border-width:2px"' : '') + '>'
      + esc(nomEq(t, m.b))+'</button></div></div>';
  }

  ouvrirSheet("Match " + m.ordre + " · " + (PHASES[m.phase] || ""),
    '<div>' + ligne("a") + ligne("b") + '</div>'
    + '<div id="tw">' + blocTab() + '</div>'
    + '<p class="muted" style="font-size:13px;margin:0">Arbitre : <b>'
    + (m.arbitre ? esc(nomEq(t, m.arbitre)) : "à désigner") + '</b></p>'
    + '<button class="btn primary wide" id="ok">Enregistrer le score</button>'
    + (matchJoue(m) ? '<button class="btn wide ghost" id="eff">Effacer le score</button>' : ''),
    function(root){
      function brancherTab(){
        Array.prototype.forEach.call(root.querySelectorAll("[data-tab]"), function(b){
          b.onclick = function(){ tab = b.dataset.tab; maj(); };
        });
      }
      function maj(){
        root.querySelector("#sc-a").textContent = sa;
        root.querySelector("#sc-b").textContent = sb;
        root.querySelector("#tw").innerHTML = blocTab();
        brancherTab();
      }
      Array.prototype.forEach.call(root.querySelectorAll("[data-s]"), function(b){
        b.onclick = function(){
          var d = parseInt(b.dataset.d, 10);
          if(b.dataset.s === "a") sa = Math.max(0, sa + d); else sb = Math.max(0, sb + d);
          if(sa !== sb) tab = null;
          maj();
        };
      });
      brancherTab();
      root.querySelector("#ok").onclick = function(){
        if(m.phase !== "poule" && sa === sb && !tab){
          return toast("Désigne l'équipe qui gagne aux tirs au but");
        }
        m.sa = sa; m.sb = sb; m.tab = sa === sb ? tab : null;
        sauverTournoi(t); fermerSheet(); render(); toast("Score enregistré");
      };
      var eff = root.querySelector("#eff");
      if(eff) eff.onclick = function(){
        m.sa = null; m.sb = null; m.tab = null;
        sauverTournoi(t); fermerSheet(); render(); toast("Score effacé");
      };
    });
}

var VUES = {jour:vueJour, seance:vueSeance, cycle:vueCycle, groupes:vueGroupes,
            classes:vueClasses, classe:vueClasse, rappels:vueRappels,
            docs:vueDocs, doc:vueDoc,
            eleves:vueEleves, eleve:vueEleve, dispenses:vueDispenses,
            atelier:vueAtelier, reglages:vueReglages,
            unss:vueUnss, tournoi:vueTournoi, classement:vueClassement};
function render(){
  renderNav();
  (VUES[view.n] || vueJour)();
}
render();
</script>
